<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Mushak &amp; Vinayaka: The Vahana's Journey</title>
<meta name="description" content="A browser action-adventure for Ganesh Chaturthi. Play as Mushak and Vinayaka on the road to Gajamukhasura.">
<meta name="theme-color" content="#1A1033">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --night:#150C26; --deep:#0B0614; --gold:#F2A81D; --gold-lt:#FFD97A;
    --cream:#FFF7E6; --kumkum:#D6432F;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--deep);overflow:hidden;
    font-family:"Mukta","Segoe UI",system-ui,sans-serif;color:var(--cream);
    -webkit-tap-highlight-color:transparent;overscroll-behavior:none;}
  #game{display:block;width:100vw;height:100vh;height:100dvh;touch-action:none;}

  

  /* ---- rotate hint ---- */
  #rotate{display:none;position:fixed;inset:0;z-index:30;background:rgba(11,6,20,.92);
    align-items:center;justify-content:center;text-align:center;padding:2rem;}
  #rotate p{max-width:18rem;font-size:1.05rem;line-height:1.5;}
  #rotate span{display:block;font-family:"Yatra One",serif;font-size:1.6rem;color:var(--gold-lt);margin-bottom:.6rem;}

  
</style>
</head>
<body>
<canvas id="game" aria-label="Mushak and Vinayaka, a browser adventure game"></canvas>

<div id="rotate" role="status">

</div>

/* -------------------------------------------------------- image assets */
G.Assets = {
  logo: null, logoReady: false,
  init: function () {
    if (typeof window === 'undefined' || typeof G.LOGO_DATA_URI !== 'string' || !G.LOGO_DATA_URI) return;
    try {
      var img = new window.Image();
      var self = this;
      img.onload = function () { self.logoReady = true; };
      img.src = G.LOGO_DATA_URI;
      this.logo = img;
    } catch (e) { }
  },
  drawLogo: function (ctx, x, y, maxW, maxH) {
    if (!this.logo || (!this.logoReady && !this.logo.naturalWidth)) return false;
    var iw = this.logo.naturalWidth || 68, ih = this.logo.naturalHeight || 68;
    var scale = Math.min(maxW / iw, maxH / ih);
    var w = iw * scale, h = ih * scale;
    ctx.drawImage(this.logo, x - w / 2, y - h / 2, w, h);
    return true;
  }
};
G.Assets.init();

/* =========================================================================
   Mushak & Vinayaka: The Vahana's Journey
   00_core.js  -  engine core: constants, math, input, audio, save, camera,
                  particle pool, collision helpers.
   ========================================================================= */
G.VERSION = '1.0.0';

/* ---------------------------------------------------------------- config */
G.W = 960;            // logical render width
G.H = 540;            // logical render height

/* ------------------------------------------------------------------ math */
var M = G.math = {
  clamp: function (v, a, b) { return v < a ? a : (v > b ? b : v); },
  lerp: function (a, b, t) { return a + (b - a) * t; },
  dist: function (ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return Math.sqrt(dx * dx + dy * dy); },
  dist2: function (ax, ay, bx, by) { var dx = bx - ax, dy = by - ay; return dx * dx + dy * dy; },
  ang: function (ax, ay, bx, by) { return Math.atan2(by - ay, bx - ax); },
  rand: function (a, b) { return a + Math.random() * (b - a); },
  randInt: function (a, b) { return Math.floor(a + Math.random() * (b - a + 1)); },
  pick: function (arr) { return arr[Math.floor(Math.random() * arr.length)]; },
  approach: function (v, target, step) {
    if (v < target) return Math.min(v + step, target);
    return Math.max(v - step, target);
  },
  angDiff: function (a, b) {
    var d = b - a;
    while (d > Math.PI) d -= Math.PI * 2;
    while (d < -Math.PI) d += Math.PI * 2;
    return d;
  }
};

/* ------------------------------------------------------------- collision */
G.hit = {
  circles: function (a, b) {
    var r = a.r + b.r;
    return M.dist2(a.x, a.y, b.x, b.y) <= r * r;
  },
  circleRect: function (cx, cy, cr, rect) {
    var nx = M.clamp(cx, rect.x, rect.x + rect.w);
    var ny = M.clamp(cy, rect.y, rect.y + rect.h);
    return M.dist2(cx, cy, nx, ny) <= cr * cr;
  },
  // resolve a circle out of a rect, returns {x,y}
  pushOut: function (cx, cy, cr, rect) {
    var nx = M.clamp(cx, rect.x, rect.x + rect.w);
    var ny = M.clamp(cy, rect.y, rect.y + rect.h);
    var dx = cx - nx, dy = cy - ny;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (d > cr || d === 0) {
      // centre inside rect (or exactly on edge): push along smallest axis
      var left = cx - rect.x, right = rect.x + rect.w - cx;
      var top = cy - rect.y, bottom = rect.y + rect.h - cy;
      var m = Math.min(left, right, top, bottom);
      if (m === left) return { x: rect.x - cr, y: cy };
      if (m === right) return { x: rect.x + rect.w + cr, y: cy };
      if (m === top) return { x: cx, y: rect.y - cr };
      return { x: cx, y: rect.y + rect.h + cr };
    }
    var k = cr / d;
    return { x: nx + dx * k, y: ny + dy * k };
  },
  // is b inside the melee arc of a (facing angle f, arc width, range)
  inArc: function (ax, ay, f, range, arc, bx, by, br) {
    if (M.dist2(ax, ay, bx, by) > (range + br) * (range + br)) return false;
    var d = Math.abs(M.angDiff(f, M.ang(ax, ay, bx, by)));
    return d <= arc * 0.5;
  }
};

/* ----------------------------------------------------------------- input */
/* One movement vector feeds both keyboard and the virtual joystick so that
   gameplay code never branches on device type. */
G.Input = {
  ax: 0, ay: 0,                 // normalised movement axis (-1..1)
  _down: {}, _press: {},
  joy: { active: false, id: null, bx: 0, by: 0, dx: 0, dy: 0, radius: 58 },
  buttons: [],                  // on-screen buttons (set per character by UI)
  touchUsed: false,
  pointer: { x: 0, y: 0, down: false, justDown: false, justUp: false },

  keymap: {
    KeyW: 'up', ArrowUp: 'up', KeyS: 'down', ArrowDown: 'down',
    KeyA: 'left', ArrowLeft: 'left', KeyD: 'right', ArrowRight: 'right',
    KeyJ: 'attack', KeyK: 'divine', KeyL: 'assist',
    Space: 'dodge', KeyE: 'interact', Enter: 'interact',
    Escape: 'pause', KeyP: 'pause'
  },

  down: function (a) { return !!this._down[a]; },
  press: function (a) { return !!this._press[a]; },
  setDown: function (a, v) {
    if (v && !this._down[a]) this._press[a] = true;
    this._down[a] = v;
  },
  endFrame: function () {
    this._press = {};
    this.pointer.justDown = false;
    this.pointer.justUp = false;
  },

  attach: function (canvas, view) {
    var I = this;
    I.view = view; // {scale, ox, oy} maintained by the renderer

    function toLogical(cx, cy) {
      var v = I.view;
      return { x: (cx - v.ox) / v.scale, y: (cy - v.oy) / v.scale };
    }
    I.toLogical = toLogical;

    window.addEventListener('keydown', function (e) {
      var a = I.keymap[e.code];
      if (a) { e.preventDefault(); I.setDown(a, true); }
      I.anyKey = true;
    });
    window.addEventListener('keyup', function (e) {
      var a = I.keymap[e.code];
      if (a) { e.preventDefault(); I.setDown(a, false); }
    });
    window.addEventListener('blur', function () {
      I._down = {}; I.joy.active = false; I.joy.dx = 0; I.joy.dy = 0;
      for (var i = 0; i < I.buttons.length; i++) I.buttons[i].held = false;
    });

    function rectOf(e) {
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }

    canvas.addEventListener('pointerdown', function (e) {
      canvas.setPointerCapture && canvas.setPointerCapture(e.pointerId);
      if (e.pointerType === 'touch') I.touchUsed = true;
      var p = rectOf(e), L = toLogical(p.x, p.y);
      I.pointer.x = L.x; I.pointer.y = L.y;
      I.pointer.down = true; I.pointer.justDown = true;
      // on-screen button?
      var b = I.buttonAt(L.x, L.y);
      if (b) { b.held = true; b.id = e.pointerId; I.setDown(b.action, true); return; }
      // joystick zone = left half, lower two thirds
      if (L.x < G.W * 0.5 && L.y > G.H * 0.25 && !I.joy.active) {
        I.joy.active = true; I.joy.id = e.pointerId;
        I.joy.bx = L.x; I.joy.by = L.y; I.joy.dx = 0; I.joy.dy = 0;
      }
    });

    canvas.addEventListener('pointermove', function (e) {
      var p = rectOf(e), L = toLogical(p.x, p.y);
      I.pointer.x = L.x; I.pointer.y = L.y;
      if (I.joy.active && I.joy.id === e.pointerId) {
        var dx = L.x - I.joy.bx, dy = L.y - I.joy.by;
        var d = Math.sqrt(dx * dx + dy * dy);
        var max = I.joy.radius;
        if (d > max) { dx = dx / d * max; dy = dy / d * max; }
        I.joy.dx = dx; I.joy.dy = dy;
      }
    });

    function release(e) {
      if (I.joy.active && I.joy.id === e.pointerId) {
        I.joy.active = false; I.joy.dx = 0; I.joy.dy = 0; I.joy.id = null;
      }
      for (var i = 0; i < I.buttons.length; i++) {
        var b = I.buttons[i];
        if (b.held && b.id === e.pointerId) { b.held = false; b.id = null; I.setDown(b.action, false); }
      }
      I.pointer.down = false; I.pointer.justUp = true;
    }
    canvas.addEventListener('pointerup', release);
    canvas.addEventListener('pointercancel', release);
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    canvas.addEventListener('touchstart', function (e) { e.preventDefault(); }, { passive: false });
    canvas.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  },

  buttonAt: function (x, y) {
    for (var i = 0; i < this.buttons.length; i++) {
      var b = this.buttons[i];
      if (!b.visible) continue;
      var pad = 6;
      if (M.dist2(x, y, b.x, b.y) <= (b.r + pad) * (b.r + pad)) return b;
    }
    return null;
  },

  // combine keyboard + joystick into one axis
  update: function () {
    var kx = (this.down('right') ? 1 : 0) - (this.down('left') ? 1 : 0);
    var ky = (this.down('down') ? 1 : 0) - (this.down('up') ? 1 : 0);
    var jx = this.joy.active ? this.joy.dx / this.joy.radius : 0;
    var jy = this.joy.active ? this.joy.dy / this.joy.radius : 0;
    var x = kx + jx, y = ky + jy;
    var len = Math.sqrt(x * x + y * y);
    if (len > 1) { x /= len; y /= len; }
    if (len > 0 && len < 0.18) { x = 0; y = 0; }
    this.ax = x; this.ay = y;
  }
};

/* ----------------------------------------------------------------- audio */
/* Everything is synthesised with the WebAudio API - no third-party audio
   files, so the whole project stays free of licensing questions. */
G.Audio = {
  ctx: null, ready: false, musicGain: null, sfxGain: null,
  musicVol: 0.5, sfxVol: 0.7, _timer: null, _step: 0, _track: null,

  init: function () {
    if (this.ready) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      this.ctx = new AC();
      this.musicGain = this.ctx.createGain();
      this.sfxGain = this.ctx.createGain();
      this.musicGain.gain.value = this.musicVol * 0.35;
      this.sfxGain.gain.value = this.sfxVol;
      this.musicGain.connect(this.ctx.destination);
      this.sfxGain.connect(this.ctx.destination);
      this.ready = true;
    } catch (e) { this.ready = false; }
  },
  resume: function () { if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume(); },
  setMusic: function (v) { this.musicVol = v; if (this.musicGain) this.musicGain.gain.value = v * 0.35; },
  setSfx: function (v) { this.sfxVol = v; if (this.sfxGain) this.sfxGain.gain.value = v; },

  tone: function (opts) {
    if (!this.ready) return;
    try {
      var c = this.ctx, t = c.currentTime;
      var o = c.createOscillator(), g = c.createGain();
      o.type = opts.type || 'sine';
      o.frequency.setValueAtTime(opts.f || 440, t);
      if (opts.f2) o.frequency.exponentialRampToValueAtTime(Math.max(20, opts.f2), t + (opts.d || 0.2));
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(Math.max(0.0002, opts.v || 0.2), t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + (opts.d || 0.2));
      o.connect(g); g.connect(this.sfxGain);
      o.start(t); o.stop(t + (opts.d || 0.2) + 0.03);
    } catch (e) { }
  },
  noise: function (dur, vol, filter) {
    if (!this.ready) return;
    try {
      var c = this.ctx, t = c.currentTime;
      var n = Math.floor(c.sampleRate * dur);
      var buf = c.createBuffer(1, n, c.sampleRate), d = buf.getChannelData(0);
      for (var i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
      var s = c.createBufferSource(); s.buffer = buf;
      var g = c.createGain(); g.gain.value = vol || 0.2;
      var f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = filter || 1200;
      s.connect(f); f.connect(g); g.connect(this.sfxGain);
      s.start(t);
    } catch (e) { }
  },

  sfx: function (name) {
    switch (name) {
      case 'step': this.tone({ f: 180, f2: 120, d: 0.05, v: 0.05, type: 'triangle' }); break;
      case 'pickup': this.tone({ f: 740, f2: 1180, d: 0.16, v: 0.16, type: 'triangle' }); break;
      case 'modak': this.tone({ f: 620, f2: 980, d: 0.2, v: 0.18, type: 'sine' }); break;
      case 'ui': this.tone({ f: 520, f2: 660, d: 0.09, v: 0.12, type: 'square' }); break;
      case 'dash': this.noise(0.18, 0.12, 2400); break;
      case 'attack': this.tone({ f: 300, f2: 160, d: 0.12, v: 0.16, type: 'sawtooth' }); break;
      case 'hit': this.noise(0.12, 0.18, 900); this.tone({ f: 200, f2: 90, d: 0.12, v: 0.14, type: 'square' }); break;
      case 'divine': this.tone({ f: 420, f2: 1200, d: 0.5, v: 0.2, type: 'sine' }); this.noise(0.4, 0.1, 3000); break;
      case 'assist': this.tone({ f: 900, f2: 1500, d: 0.18, v: 0.14, type: 'triangle' }); break;
      case 'hurt': this.tone({ f: 260, f2: 70, d: 0.3, v: 0.2, type: 'sawtooth' }); break;
      case 'boss': this.tone({ f: 90, f2: 48, d: 0.7, v: 0.25, type: 'sawtooth' }); break;
      case 'slam': this.noise(0.5, 0.3, 500); this.tone({ f: 70, f2: 40, d: 0.5, v: 0.22, type: 'square' }); break;
      case 'tusk': this.tone({ f: 300, f2: 1800, d: 0.8, v: 0.25, type: 'triangle' }); this.noise(0.6, 0.2, 4000); break;
      case 'switch': this.tone({ f: 500, f2: 900, d: 0.35, v: 0.16, type: 'sine' }); break;
      case 'bell': this.tone({ f: 880, f2: 870, d: 1.1, v: 0.16, type: 'sine' }); this.tone({ f: 1320, f2: 1310, d: 0.9, v: 0.07, type: 'sine' }); break;
      case 'win': this.tone({ f: 523, d: 0.3, v: 0.18, type: 'sine' }); this.tone({ f: 659, d: 0.45, v: 0.15, type: 'sine' }); this.tone({ f: 784, d: 0.7, v: 0.14, type: 'sine' }); break;
      case 'lose': this.tone({ f: 330, f2: 130, d: 0.9, v: 0.2, type: 'triangle' }); break;
    }
  },

  /* Music: a slow pentatonic (Raga Bhoopali-flavoured) arpeggio over a drone. */
  music: function (track) {
    if (!this.ready) return;
    if (this._track === track) return;
    this._track = track;
    this.stopMusic(true);
    if (!track) return;
    var scales = {
      divine: [0, 2, 4, 7, 9, 12, 9, 7],
      forest: [0, 2, 4, 7, 9, 11, 9, 4],
      ruins: [0, 1, 4, 5, 7, 8, 7, 5],
      dark: [0, 1, 3, 6, 7, 8, 7, 3],
      boss: [0, 1, 3, 6, 8, 6, 3, 1],
      calm: [0, 4, 7, 9, 12, 9, 7, 4]
    };
    var roots = { divine: 261.6, forest: 246.9, ruins: 220, dark: 174.6, boss: 146.8, calm: 261.6 };
    var seq = scales[track] || scales.divine, root = roots[track] || 261.6;
    var self = this, i = 0;
    // drone
    try {
      var c = this.ctx, o = c.createOscillator(), g = c.createGain();
      o.type = 'sine'; o.frequency.value = root / 2;
      g.gain.value = 0.16; o.connect(g); g.connect(this.musicGain);
      o.start(); this._drone = { o: o, g: g };
      var o2 = c.createOscillator(), g2 = c.createGain();
      o2.type = 'triangle'; o2.frequency.value = root * 0.7502;
      g2.gain.value = 0.05; o2.connect(g2); g2.connect(this.musicGain);
      o2.start(); this._drone2 = { o: o2, g: g2 };
    } catch (e) { }
    var tempo = track === 'boss' ? 260 : 420;
    this._timer = setInterval(function () {
      if (!self.ctx) return;
      var semi = seq[i % seq.length];
      var f = root * Math.pow(2, semi / 12);
      try {
        var c = self.ctx, t = c.currentTime;
        var o = c.createOscillator(), g = c.createGain();
        o.type = track === 'boss' ? 'sawtooth' : 'triangle';
        o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.10, t + 0.05);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
        o.connect(g); g.connect(self.musicGain);
        o.start(t); o.stop(t + 1.0);
      } catch (e) { }
      i++;
    }, tempo);
  },
  stopMusic: function (keepTrack) {
    if (this._timer) { clearInterval(this._timer); this._timer = null; }
    if (!keepTrack) this._track = null;
    var d = this._drone, d2 = this._drone2;
    try { if (d) { d.g.gain.value = 0; d.o.stop(); } } catch (e) { }
    try { if (d2) { d2.g.gain.value = 0; d2.o.stop(); } } catch (e) { }
    this._drone = null; this._drone2 = null;
  }
};

/* ------------------------------------------------------------------ save */
G.Save = {
  key: 'mushak_vinayaka_save_v1',
  data: {
    best: 0, bestStars: 0, introWatched: false, runs: 0,
    settings: { music: 0.5, sfx: 0.7, shake: true, lowFx: false, skipIntro: false }
  },
  load: function () {
    try {
      var raw = window.localStorage.getItem(this.key);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && typeof d === 'object') {
          this.data.best = d.best || 0;
          this.data.bestStars = d.bestStars || 0;
          this.data.introWatched = !!d.introWatched;
          this.data.runs = d.runs || 0;
          if (d.settings) for (var k in d.settings) this.data.settings[k] = d.settings[k];
        }
      }
    } catch (e) { }
    G.Audio.musicVol = this.data.settings.music;
    G.Audio.sfxVol = this.data.settings.sfx;
    return this.data;
  },
  save: function () {
    try { window.localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) { }
  }
};

/* ---------------------------------------------------------------- camera */
G.Camera = {
  x: 0, y: 0, shake: 0, shakeT: 0,
  bounds: { x: 0, y: 0, w: G.W, h: G.H },
  snap: function (x, y) { this.x = x; this.y = y; this.clamp(); },
  follow: function (t, dt) {
    this.x = M.lerp(this.x, t.x, Math.min(1, dt * 5));
    this.y = M.lerp(this.y, t.y, Math.min(1, dt * 5));
    this.clamp();
  },
  clamp: function () {
    var b = this.bounds;
    if (b.w <= G.W) this.x = b.x + b.w / 2;
    else this.x = M.clamp(this.x, b.x + G.W / 2, b.x + b.w - G.W / 2);
    if (b.h <= G.H) this.y = b.y + b.h / 2;
    else this.y = M.clamp(this.y, b.y + G.H / 2, b.y + b.h - G.H / 2);
  },
  kick: function (amount) {
    if (!G.Save.data.settings.shake) return;
    this.shake = Math.max(this.shake, amount); this.shakeT = 0.28;
  },
  update: function (dt) {
    if (this.shakeT > 0) { this.shakeT -= dt; if (this.shakeT <= 0) this.shake = 0; }
  },
  apply: function (ctx) {
    var ox = 0, oy = 0;
    if (this.shake > 0) {
      ox = M.rand(-this.shake, this.shake) * (this.shakeT / 0.28);
      oy = M.rand(-this.shake, this.shake) * (this.shakeT / 0.28);
    }
    ctx.translate(Math.round(G.W / 2 - this.x + ox), Math.round(G.H / 2 - this.y + oy));
  }
};

/* ------------------------------------------------------------- particles */
G.FX = {
  pool: [], max: 420,
  reset: function () { this.pool.length = 0; },
  spawn: function (x, y, opts) {
    if (G.Save.data.settings.lowFx && this.pool.length > 90) return;
    if (this.pool.length >= this.max) return;
    var p = {
      x: x, y: y,
      vx: opts.vx || 0, vy: opts.vy || 0,
      life: opts.life || 0.6, max: opts.life || 0.6,
      r: opts.r || 3, color: opts.color || '#FFD97A',
      grav: opts.grav || 0, drag: opts.drag == null ? 0.9 : opts.drag,
      shape: opts.shape || 'circle', spin: opts.spin || 0, a: opts.a || 0,
      glow: opts.glow !== false
    };
    this.pool.push(p);
    return p;
  },
  burst: function (x, y, n, opts) {
    opts = opts || {};
    var count = G.Save.data.settings.lowFx ? Math.ceil(n * 0.4) : n;
    for (var i = 0; i < count; i++) {
      var a = M.rand(0, Math.PI * 2), s = M.rand(opts.smin || 40, opts.smax || 160);
      this.spawn(x, y, {
        vx: Math.cos(a) * s, vy: Math.sin(a) * s,
        life: M.rand(opts.lmin || 0.3, opts.lmax || 0.8),
        r: M.rand(opts.rmin || 2, opts.rmax || 5),
        color: opts.colors ? M.pick(opts.colors) : (opts.color || '#FFD97A'),
        grav: opts.grav || 0, drag: opts.drag, shape: opts.shape, glow: opts.glow
      });
    }
  },
  update: function (dt) {
    for (var i = this.pool.length - 1; i >= 0; i--) {
      var p = this.pool[i];
      p.life -= dt;
      if (p.life <= 0) { this.pool.splice(i, 1); continue; }
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += p.grav * dt;
      var d = Math.pow(p.drag, dt * 60);
      p.vx *= d; p.vy *= d;
      p.a += p.spin * dt;
    }
  },
  draw: function (ctx) {
    for (var i = 0; i < this.pool.length; i++) {
      var p = this.pool[i], k = p.life / p.max;
      ctx.globalAlpha = Math.max(0, Math.min(1, k));
      ctx.fillStyle = p.color;
      if (p.shape === 'spark') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.fillRect(-p.r * 2, -p.r * 0.35, p.r * 4, p.r * 0.7);
        ctx.restore();
      } else if (p.shape === 'petal') {
        ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a);
        ctx.beginPath(); ctx.ellipse(0, 0, p.r * 1.6, p.r * 0.8, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
      } else {
        ctx.beginPath(); ctx.arc(p.x, p.y, p.r * (0.4 + k * 0.6), 0, Math.PI * 2); ctx.fill();
      }
    }
    ctx.globalAlpha = 1;
  }
};



/* ===== 10_art.js ===== */
/* =========================================================================
   10_art.js  -  stylised vector art. Every sprite is drawn procedurally on
   the 2D canvas, so the build carries no third-party image assets.
   Visual identity: temple festival palette - marigold, kumkum, sandal,
   peacock green, and an indigo/violet underworld for the Asura realm.
   ========================================================================= */
var M = G.math;

G.Palette = {
  gold: '#F2A81D', goldLt: '#FFD97A', goldDp: '#C87816',
  kumkum: '#D6432F', kumkumDp: '#9C2A1E',
  sandal: '#F3E3C3', sandalDp: '#D9C199',
  skin: '#F6C88B', skinDp: '#D9A263',
  grey: '#B9AFA3', greyDp: '#8A7F72',
  leaf: '#2F7D5B', leafDp: '#1F5C42', leafLt: '#5DA97C',
  stone: '#A79B88', stoneDp: '#6F6555',
  night: '#1A1033', nightDp: '#0D081C',
  violet: '#6A3FA0', violetLt: '#9B6BD6',
  ember: '#FF6B35',
  ink: '#241A12',
  white: '#FFF7E6'
};
var P = G.Palette;

/* ---------------------------------------------------------- environments */
G.Env = {
  themes: {
    divine: { floor: '#F0DFB8', floorAlt: '#E6D2A4', edge: '#C9AE7C', sky: '#FBEFD2', accent: '#F2A81D' },
    forest: { floor: '#3F7F53', floorAlt: '#356E48', edge: '#24523A', sky: '#2C6B46', accent: '#9BD6A0' },
    ruins: { floor: '#9A8E7A', floorAlt: '#8B7F6C', edge: '#6A6154', sky: '#7E7666', accent: '#C9A227' },
    cavern: { floor: '#4A4258', floorAlt: '#403950', edge: '#2B2538', sky: '#2A2338', accent: '#9B6BD6' },
    asura: { floor: '#2E1F47', floorAlt: '#271A3D', edge: '#170F26', sky: '#1A1033', accent: '#B44BD6' },
    arena: { floor: '#3A2350', floorAlt: '#321E46', edge: '#1D1230', sky: '#150C26', accent: '#FF6B35' }
  },

  drawGround: function (ctx, level, cam, t) {
    var th = this.themes[level.theme] || this.themes.divine;
    ctx.fillStyle = th.sky;
    ctx.fillRect(level.x - 400, level.y - 400, level.w + 800, level.h + 800);

    // tiled floor
    var ts = 80;
    var x0 = Math.floor((cam.x - G.W / 2 - ts) / ts) * ts;
    var y0 = Math.floor((cam.y - G.H / 2 - ts) / ts) * ts;
    for (var y = y0; y < cam.y + G.H / 2 + ts; y += ts) {
      for (var x = x0; x < cam.x + G.W / 2 + ts; x += ts) {
        if (x < level.x - ts || y < level.y - ts || x > level.x + level.w || y > level.y + level.h) continue;
        var odd = ((Math.floor(x / ts) + Math.floor(y / ts)) % 2) === 0;
        ctx.fillStyle = odd ? th.floor : th.floorAlt;
        ctx.fillRect(x, y, ts, ts);
      }
    }
    // texture flecks tied to the theme
    ctx.globalAlpha = 0.14;
    ctx.fillStyle = th.edge;
    for (var i = 0; i < 90; i++) {
      var fx = level.x + ((i * 7919) % level.w), fy = level.y + ((i * 104729) % level.h);
      if (Math.abs(fx - cam.x) > G.W / 2 + 40 || Math.abs(fy - cam.y) > G.H / 2 + 40) continue;
      ctx.fillRect(fx, fy, 14, 4);
    }
    ctx.globalAlpha = 1;

    // border band
    ctx.strokeStyle = th.edge; ctx.lineWidth = 14;
    ctx.strokeRect(level.x - 7, level.y - 7, level.w + 14, level.h + 14);

    if (level.theme === 'divine') this.rangoli(ctx, level.x + level.w / 2, level.y + level.h / 2, 140, t);
    if (level.theme === 'arena') this.arenaRing(ctx, level.x + level.w / 2, level.y + level.h / 2, level.w * 0.42, t);
  },

  rangoli: function (ctx, cx, cy, r, t) {
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(t * 0.05);
    ctx.globalAlpha = 0.5;
    for (var ring = 0; ring < 3; ring++) {
      var rr = r * (0.4 + ring * 0.3);
      ctx.strokeStyle = ring % 2 ? P.kumkum : P.gold;
      ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(0, 0, rr, 0, Math.PI * 2); ctx.stroke();
      var n = 8 + ring * 4;
      for (var i = 0; i < n; i++) {
        var a = (i / n) * Math.PI * 2;
        ctx.beginPath();
        ctx.ellipse(Math.cos(a) * rr, Math.sin(a) * rr, 9, 5, a, 0, Math.PI * 2);
        ctx.fillStyle = ring % 2 ? P.gold : P.kumkum; ctx.fill();
      }
    }
    ctx.restore(); ctx.globalAlpha = 1;
  },

  arenaRing: function (ctx, cx, cy, r, t) {
    ctx.save(); ctx.translate(cx, cy);
    ctx.globalAlpha = 0.55; ctx.strokeStyle = '#FF6B35'; ctx.lineWidth = 6;
    ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 0.3; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(0, 0, r - 26, 0, Math.PI * 2); ctx.stroke();
    ctx.rotate(t * 0.18);
    for (var i = 0; i < 12; i++) {
      var a = (i / 12) * Math.PI * 2;
      ctx.globalAlpha = 0.35 + 0.25 * Math.sin(t * 2 + i);
      ctx.fillStyle = '#B44BD6';
      ctx.beginPath(); ctx.arc(Math.cos(a) * (r - 13), Math.sin(a) * (r - 13), 7, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;
  },

  /* props: p = {type,x,y,w,h} */
  drawProp: function (ctx, p, t) {
    switch (p.type) {
      case 'pillar': this.pillar(ctx, p); break;
      case 'brokenPillar': this.pillar(ctx, p, true); break;
      case 'tree': this.tree(ctx, p, t); break;
      case 'rock': this.rock(ctx, p); break;
      case 'lamp': this.lamp(ctx, p, t); break;
      case 'arch': this.arch(ctx, p); break;
      case 'gate': this.gate(ctx, p, t); break;
      case 'lever': this.lever(ctx, p); break;
      case 'crystal': this.crystal(ctx, p, t); break;
      case 'spire': this.spire(ctx, p); break;
      case 'bush': this.bush(ctx, p); break;
      case 'water': this.water(ctx, p, t); break;
      case 'footprint': this.footprint(ctx, p); break;
      case 'darkvent': this.darkvent(ctx, p, t); break;
    }
  },

  shadowEllipse: function (ctx, x, y, rx, ry, a) {
    ctx.save();
    ctx.globalAlpha = a == null ? 0.22 : a;
    ctx.fillStyle = '#000';
    ctx.beginPath(); ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  },

  pillar: function (ctx, p, broken) {
    var h = broken ? p.h * 0.55 : p.h;
    var g = G.Game;
    var occluding = false;
    if (g && g.player) {
      var pl = g.player;
      if (pl.x >= p.x - 30 && pl.x <= p.x + p.w + 30 &&
          pl.y >= p.y + p.h - h - 45 && pl.y <= p.y + p.h + 20) {
        occluding = true;
      }
    }
    if (!occluding && g && g.companion) {
      var co = g.companion;
      if (co.x >= p.x - 30 && co.x <= p.x + p.w + 30 &&
          co.y >= p.y + p.h - h - 45 && co.y <= p.y + p.h + 20) {
        occluding = true;
      }
    }
    if (!occluding && g && g.level && g.level.pickups) {
      for (var k = 0; k < g.level.pickups.length; k++) {
        var pk = g.level.pickups[k];
        if (!pk.taken && pk.x >= p.x - 30 && pk.x <= p.x + p.w + 30 &&
            pk.y >= p.y + p.h - h - 45 && pk.y <= p.y + p.h + 20) {
          occluding = true;
          break;
        }
      }
    }

    ctx.save();
    this.shadowEllipse(ctx, p.x + p.w / 2, p.y + p.h, p.w * 0.7, 10);
    if (occluding) {
      ctx.globalAlpha = 0.38;
    }
    ctx.fillStyle = P.stoneDp; ctx.fillRect(p.x - 6, p.y + p.h - 14, p.w + 12, 16);
    ctx.fillStyle = P.stone; ctx.fillRect(p.x, p.y + p.h - h, p.w, h);

    ctx.fillStyle = P.gold; ctx.fillRect(-30, 22, 60, 5);
    // arms
    ctx.fillStyle = P.skin;
    ctx.fillRect(-24, -14, 8, 22);
    ctx.save(); ctx.translate(20, -16); ctx.rotate(-0.5 + Math.sin(t) * 0.05); ctx.fillRect(-4, -12, 8, 20); ctx.restore();
    // head
    ctx.fillStyle = P.skin;
    ctx.beginPath(); ctx.arc(0, -38, 13, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#241A12';
    ctx.beginPath(); ctx.arc(0, -42, 14, Math.PI, Math.PI * 2); ctx.fill();
    ctx.fillRect(-14, -42, 5, 18); ctx.fillRect(9, -42, 5, 18);
    ctx.fillStyle = '#2B2118';
    ctx.beginPath(); ctx.arc(-4.5, -37, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(4.5, -37, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = P.kumkum;
    ctx.beginPath(); ctx.arc(0, -43, 2.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = P.gold;
    ctx.beginPath(); ctx.moveTo(-12, -50); ctx.lineTo(12, -50); ctx.lineTo(0, -60); ctx.closePath(); ctx.fill();
    ctx.restore();
  },

  /* ---- Asuras: shadow-forged, stylised, never gory ---- */
  asura: function (ctx, a) {
    var t = a.t || 0, s = a.scale || 1, f = a.faceRight ? 1 : -1;
    var heavy = a.heavy;
    G.Env.shadowEllipse(ctx, a.x, a.y + (heavy ? 30 : 20) * s, (heavy ? 26 : 17) * s, 7 * s, 0.28);
    ctx.save();
    ctx.translate(a.x, a.y + Math.sin(t * (heavy ? 3 : 6)) * 1.5);
    ctx.scale(s * f, s);
    var body = a.stunned ? '#6B5A8C' : (heavy ? '#3C2352' : '#4A2C6B');
    var trim = a.windup ? '#FF8A3D' : (a.stunned ? '#C9B6E8' : '#B44BD6');

    if (heavy) {
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.ellipse(0, 6, 26, 24, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = body;
      ctx.fillRect(-30, -4, 12, 26); ctx.fillRect(18, -4, 12, 26);
      ctx.fillStyle = trim;
      ctx.beginPath(); ctx.ellipse(0, 4, 13, 10, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, -22, 16, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = trim;
      ctx.beginPath(); ctx.moveTo(-16, -30); ctx.lineTo(-22, -46); ctx.lineTo(-8, -34); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(16, -30); ctx.lineTo(22, -46); ctx.lineTo(8, -34); ctx.closePath(); ctx.fill();
      ctx.fillStyle = a.stunned ? '#FFD97A' : '#FFDD55';
      ctx.beginPath(); ctx.arc(-6, -22, 3.4, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(7, -22, 3.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.ellipse(0, 4, 15, 16, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillRect(-18, -2, 7, 18); ctx.fillRect(11, -2, 7, 18);
      ctx.fillStyle = body;
      ctx.beginPath(); ctx.arc(0, -16, 12, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = trim;
      ctx.beginPath(); ctx.moveTo(-11, -22); ctx.lineTo(-15, -34); ctx.lineTo(-5, -26); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(11, -22); ctx.lineTo(15, -34); ctx.lineTo(5, -26); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#FFDD55';
      ctx.beginPath(); ctx.arc(-4, -16, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(5, -16, 2.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();

    if (a.stunned) {
      for (var i = 0; i < 3; i++) {
        var ang = t * 6 + i * 2.1;
        ctx.fillStyle = P.goldLt;
        ctx.beginPath();
        ctx.arc(a.x + Math.cos(ang) * 20, a.y - 42 * s + Math.sin(ang) * 6, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  },

  /* ---- Gajamukhasura: imposing, high-contrast, non-gory ---- */
  boss: function (ctx, a) {
    var t = a.t || 0, s = a.scale || 1, f = a.faceRight ? 1 : -1;
    G.Env.shadowEllipse(ctx, a.x, a.y + 58 * s, 52 * s, 14 * s, 0.32);
    ctx.save();
    ctx.translate(a.x, a.y + Math.sin(t * 2) * 3);
    ctx.scale(s * f, s);
    var dark = a.vulnerable ? '#7A4A9E' : '#2B1840';
    var trim = a.windup ? '#FF8A3D' : (a.vulnerable ? '#FFD97A' : '#B44BD6');

    // cloak
    ctx.fillStyle = '#1B0F2B';
    ctx.beginPath();
    ctx.moveTo(-54, 56); ctx.quadraticCurveTo(0, 10, 54, 56); ctx.closePath(); ctx.fill();
    // legs + torso
    ctx.fillStyle = dark;
    ctx.fillRect(-26, 20, 18, 36); ctx.fillRect(8, 20, 18, 36);
    ctx.beginPath(); ctx.ellipse(0, 4, 40, 34, 0, 0, Math.PI * 2); ctx.fill();
    // chest sigil
    ctx.fillStyle = trim; ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(0, 2, 13 + Math.sin(t * 4) * 2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // arms
    ctx.fillStyle = dark;
    ctx.save(); ctx.translate(-44, -6); ctx.rotate(-0.3 + (a.armSwing || 0)); ctx.fillRect(-11, 0, 22, 44); ctx.restore();
    ctx.save(); ctx.translate(44, -6); ctx.rotate(0.3 - (a.armSwing || 0)); ctx.fillRect(-11, 0, 22, 44); ctx.restore();
    // head (elephant-faced asura)
    ctx.save(); ctx.translate(0, -46);
    ctx.fillStyle = dark;
    ctx.beginPath(); ctx.ellipse(-34, 2, 16, 22, -0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(34, 2, 16, 22, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(0, 0, 27, 25, 0, 0, Math.PI * 2); ctx.fill();
    // crown of spikes
    ctx.fillStyle = trim;
    for (var i = -2; i <= 2; i++) {
      ctx.beginPath();
      ctx.moveTo(i * 12 - 5, -20); ctx.lineTo(i * 12, -20 - (14 - Math.abs(i) * 3)); ctx.lineTo(i * 12 + 5, -20);
      ctx.closePath(); ctx.fill();
    }
    // trunk
    ctx.strokeStyle = dark; ctx.lineWidth = 17; ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 14);
    ctx.quadraticCurveTo(14 + Math.sin(t * 2) * 5, 34, 4, 48);
    ctx.stroke();
    // tusks
    ctx.fillStyle = '#EFE6D2';
    ctx.beginPath(); ctx.moveTo(-14, 16); ctx.lineTo(-26, 40); ctx.lineTo(-8, 22); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(14, 16); ctx.lineTo(26, 40); ctx.lineTo(8, 22); ctx.closePath(); ctx.fill();
    // eyes
    ctx.fillStyle = a.vulnerable ? '#FFD97A' : '#FF5C33';
    ctx.beginPath(); ctx.arc(-11, -2, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(11, -2, 4.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
    ctx.restore();
  },

  /* mouse form of Gajamukhasura after the divine resolution */
  vahanaMouse: function (ctx, a) {
    G.Art.mushak(ctx, { x: a.x, y: a.y, t: a.t, scale: (a.scale || 1) * 1.15, faceRight: a.faceRight !== false, tint: '#8E7FB0', glow: true });
  },

  /* ---- collectibles ---- */
  pickup: function (ctx, p, t) {
    var y = p.y + Math.sin(t * 3 + p.x * 0.05) * 4;
    ctx.save();
    G.Env.shadowEllipse(ctx, p.x, p.y + 12, 9, 3.5, 0.18);
    switch (p.kind) {
      case 'modak':
        ctx.fillStyle = P.goldLt;
        ctx.beginPath();
        ctx.moveTo(p.x, y - 13); ctx.quadraticCurveTo(p.x + 12, y + 6, p.x, y + 9);
        ctx.quadraticCurveTo(p.x - 12, y + 6, p.x, y - 13); ctx.closePath(); ctx.fill();
        ctx.fillStyle = P.goldDp;
        ctx.fillRect(p.x - 9, y + 6, 18, 4);
        ctx.fillStyle = P.kumkum;
        ctx.beginPath(); ctx.arc(p.x, y - 12, 2.4, 0, Math.PI * 2); ctx.fill();
        break;
      case 'flower':
        ctx.fillStyle = P.gold;
        for (var i = 0; i < 6; i++) {
          var a2 = (i / 6) * Math.PI * 2 + t * 0.6;
          ctx.beginPath(); ctx.ellipse(p.x + Math.cos(a2) * 7, y + Math.sin(a2) * 7, 5, 3.6, a2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = P.kumkum;
        ctx.beginPath(); ctx.arc(p.x, y, 4.2, 0, Math.PI * 2); ctx.fill();
        break;
      case 'durva':
        ctx.strokeStyle = P.leafLt; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
        for (var j = -1; j <= 1; j++) {
          ctx.beginPath();
          ctx.moveTo(p.x + j * 4, y + 9);
          ctx.quadraticCurveTo(p.x + j * 9, y - 2, p.x + j * 6 + Math.sin(t * 2 + j) * 3, y - 12);
          ctx.stroke();
        }
        break;
      case 'divine':
        ctx.globalAlpha = 0.3; ctx.fillStyle = P.goldLt;
        ctx.beginPath(); ctx.arc(p.x, y, 17, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
        ctx.fillStyle = P.white;
        ctx.save(); ctx.translate(p.x, y); ctx.rotate(t * 1.1);
        for (var k = 0; k < 4; k++) {
          ctx.rotate(Math.PI / 2);
          ctx.beginPath(); ctx.moveTo(0, -12); ctx.lineTo(3.4, 0); ctx.lineTo(0, 12); ctx.lineTo(-3.4, 0); ctx.closePath(); ctx.fill();
        }
        ctx.restore();
        break;
      case 'energy':
        ctx.fillStyle = '#7FE0FF'; ctx.globalAlpha = 0.28;
        ctx.beginPath(); ctx.arc(p.x, y, 15, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1;
        ctx.fillStyle = '#CFF4FF';
        ctx.beginPath();
        ctx.moveTo(p.x - 4, y - 11); ctx.lineTo(p.x + 6, y - 2); ctx.lineTo(p.x, y - 1);
        ctx.lineTo(p.x + 4, y + 11); ctx.lineTo(p.x - 6, y + 1); ctx.lineTo(p.x, y);
        ctx.closePath(); ctx.fill();
        break;
      case 'heal_orb':
        var hy = p.y + Math.sin(t * 3.6 + p.x * 0.05) * 4;
        // Soft radiant emerald aura
        ctx.globalAlpha = 0.28 + 0.12 * Math.sin(t * 4);
        ctx.fillStyle = '#34D399';
        ctx.beginPath(); ctx.arc(p.x, hy, 16, 0, Math.PI * 2); ctx.fill();
        ctx.globalAlpha = 1;
        // Luminous sphere core
        ctx.fillStyle = '#059669';
        ctx.beginPath(); ctx.arc(p.x, hy, 9, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#6EE7B7';
        ctx.beginPath(); ctx.arc(p.x - 2, hy - 2, 6, 0, Math.PI * 2); ctx.fill();
        // Inner sacred divine healing cross/star
        ctx.fillStyle = '#FEF08A';
        ctx.beginPath();
        ctx.moveTo(p.x, hy - 5); ctx.lineTo(p.x + 1.5, hy); ctx.lineTo(p.x, hy + 5); ctx.lineTo(p.x - 1.5, hy);
        ctx.closePath(); ctx.fill();
        ctx.beginPath();
        ctx.moveTo(p.x - 5, hy); ctx.lineTo(p.x, hy + 1.5); ctx.lineTo(p.x + 5, hy); ctx.lineTo(p.x, hy - 1.5);
        ctx.closePath(); ctx.fill();
        // Orbiting healing motes
        for (var oi = 0; oi < 3; oi++) {
          var oa = t * 2.6 + oi * (Math.PI * 2 / 3);
          ctx.globalAlpha = 0.6 + 0.3 * Math.sin(t * 3 + oi);
          ctx.fillStyle = '#A7F3D0';
          ctx.beginPath(); ctx.arc(p.x + Math.cos(oa) * 13, hy + Math.sin(oa) * 10, 2, 0, Math.PI * 2); ctx.fill();
        }
        ctx.globalAlpha = 1;
        break;
    }
    ctx.restore();
  }
};



/* ===== 20_entities.js ===== */
/* =========================================================================
   20_entities.js  -  player characters, companion, enemies, boss,
   projectiles, hazards. All gameplay logic; no drawing decisions here
   beyond calling into G.Art.
   ========================================================================= */
var M = G.math;

/* --------------------------------------------------------------- tuning */
G.Tune = {
  mushak: { speed: 215, dashSpeed: 560, dashTime: 0.16, dashCd: 0.85, maxHp: 60, r: 13 },
  vinayaka: {
    speed: 156, r: 20, maxHp: 100, maxEnergy: 100, energyRegen: 9,
    atkDmg: 11, atkCd: 0.34, atkRange: 74, atkArc: 2.0,
    divineDmg: 30, divineCost: 32, divineRadius: 136, divineCd: 1.1,
    dodgeSpeed: 520, dodgeTime: 0.22, dodgeCd: 0.95, iframes: 0.34,
    assistCd: 8, assistDmg: 14, assistStun: 2.0
  },
  small: { hp: 34, speed: 118, dmg: 8, windup: 0.55, r: 17, score: 100 },
  heavy: { hp: 92, speed: 62, dmg: 17, windup: 0.95, r: 27, score: 160 },
  boss: { hp: 620, speed: 110, r: 46, score: 1200 }
};

/* ---------------------------------------------------------------- utils */
function moveAndCollide(e, dx, dy, level, ignoreSmall) {
  var walls = level.walls || [];
  e.x += dx;
  for (var i = 0; i < walls.length; i++) {
    var w = walls[i];
    if (w.mouseOnly && ignoreSmall) continue;
    if (w.open) continue;
    if (G.hit.circleRect(e.x, e.y, e.r, w)) {
      var p = G.hit.pushOut(e.x, e.y, e.r, w);
      e.x = p.x;
    }
  }
  e.y += dy;
  for (var j = 0; j < walls.length; j++) {
    var w2 = walls[j];
    if (w2.mouseOnly && ignoreSmall) continue;
    if (w2.open) continue;
    if (G.hit.circleRect(e.x, e.y, e.r, w2)) {
      var p2 = G.hit.pushOut(e.x, e.y, e.r, w2);
      e.y = p2.y;
    }
  }
  e.x = M.clamp(e.x, level.x + e.r, level.x + level.w - e.r);
  e.y = M.clamp(e.y, level.y + e.r, level.y + level.h - e.r);
}
G.moveAndCollide = moveAndCollide;

/* --------------------------------------------------------------- player */
G.Player = function (kind, x, y) {
  this.kind = kind;
  this.x = x; this.y = y;
  this.t = 0;
  var T = G.Tune[kind];
  this.r = T.r;
  this.maxHp = T.maxHp; this.hp = T.maxHp;
  this.energy = kind === 'vinayaka' ? G.Tune.vinayaka.maxEnergy : 0;
  this.facing = 0; this.faceRight = true; this.moving = false;
  this.invuln = 0; this.flashT = 0;
  this.dashT = 0; this.dashCd = 0;
  this.atkCd = 0; this.atkAnim = 0; this.divineCd = 0;
  this.assistCd = 0; this.tuskReady = false; this.tuskThrown = false;
  this.dead = false;
  this.stepT = 0;
};

G.Player.prototype.damage = function (n, g) {
  if (this.invuln > 0 || this.dead) return false;
  this.hp -= n;
  this.invuln = 0.75; this.flashT = 0.4;
  g.score.damage += n;
  G.Audio.sfx('hurt');
  G.Camera.kick(7);
  G.FX.burst(this.x, this.y, 10, { colors: ['#D6432F', '#FFD97A'], smin: 40, smax: 150, lmax: 0.5 });
  if (this.hp <= 0) { this.hp = 0; this.dead = true; g.onPlayerDown(); }
  return true;
};

G.Player.prototype.heal = function (n) {
  this.hp = M.clamp(this.hp + n, 0, this.maxHp);
};

G.Player.prototype.update = function (dt, g) {
  this.t += dt;
  var I = G.Input, T = G.Tune[this.kind];
  this.invuln = Math.max(0, this.invuln - dt);
  this.flashT = Math.max(0, this.flashT - dt);
  this.atkCd = Math.max(0, this.atkCd - dt);
  this.divineCd = Math.max(0, this.divineCd - dt);
  this.dashCd = Math.max(0, this.dashCd - dt);
  this.assistCd = Math.max(0, this.assistCd - dt);
  this.atkAnim = Math.max(0, this.atkAnim - dt);

  var locked = g.inputLocked();
  var ax = locked ? 0 : I.ax, ay = locked ? 0 : I.ay;

  if (this.kind === 'vinayaka') {
    this.energy = M.clamp(this.energy + G.Tune.vinayaka.energyRegen * dt, 0, G.Tune.vinayaka.maxEnergy);
  }

  // --- dash / dodge
  if (this.dashT > 0) {
    this.dashT -= dt;
    var ds = this.kind === 'mushak' ? T.dashSpeed : T.dodgeSpeed;
    moveAndCollide(this, Math.cos(this.dashDir) * ds * dt, Math.sin(this.dashDir) * ds * dt, g.level, this.kind === 'mushak');
    if (Math.random() < 0.7) {
      G.FX.spawn(this.x, this.y + 6, {
        vx: M.rand(-20, 20), vy: M.rand(-10, 10), life: 0.3, r: M.rand(2, 4),
        color: this.kind === 'mushak' ? '#FFF2CF' : '#FFD97A'
      });
    }
  } else {
    var len = Math.sqrt(ax * ax + ay * ay);
    this.moving = len > 0.01;
    if (this.moving) {
      this.facing = Math.atan2(ay, ax);
      if (Math.abs(ax) > 0.15) this.faceRight = ax > 0;
      var sp = T.speed * (this.kind === 'vinayaka' && this.atkAnim > 0 ? 0.45 : 1);
      moveAndCollide(this, ax * sp * dt, ay * sp * dt, g.level, this.kind === 'mushak');
      this.stepT -= dt;
      if (this.stepT <= 0) { this.stepT = this.kind === 'mushak' ? 0.22 : 0.34; G.Audio.sfx('step'); }
    }
  }

  if (locked) return;

  /* ---------------- mushak abilities ---------------- */
  if (this.kind === 'mushak') {
    if (I.press('dodge') && this.dashCd <= 0) {
      this.dashDir = this.moving ? this.facing : (this.faceRight ? 0 : Math.PI);
      this.dashT = T.dashTime; this.dashCd = T.dashCd;
      this.invuln = Math.max(this.invuln, 0.2);
      G.Audio.sfx('dash');
      G.FX.burst(this.x, this.y, 8, { colors: ['#FFF2CF', '#F3E3C3'], smax: 90, lmax: 0.4 });
    }
    if (I.press('interact')) g.tryInteract();
    return;
  }

  /* ---------------- vinayaka abilities ---------------- */
  if (I.press('dodge') && this.dashCd <= 0) {
    this.dashDir = this.moving ? this.facing : (this.faceRight ? 0 : Math.PI);
    this.dashT = T.dodgeTime; this.dashCd = T.dodgeCd;
    this.invuln = Math.max(this.invuln, T.iframes);
    G.Audio.sfx('dash');
    G.FX.burst(this.x, this.y, 10, { colors: ['#FFD97A', '#FFF2CF'], smax: 110, lmax: 0.4 });
    g.tutorial('dodge');
  }

  if (I.press('attack') && this.atkCd <= 0) {
    if (this.tuskReady && !this.tuskThrown) {
      this.throwTusk(g);
    } else {
      this.atkCd = T.atkCd; this.atkAnim = 0.22;
      G.Audio.sfx('attack');
      g.swing({
        x: this.x, y: this.y, angle: this.facing || (this.faceRight ? 0 : Math.PI),
        range: T.atkRange, arc: T.atkArc, dmg: T.atkDmg, source: 'basic'
      });
      var a = this.facing || (this.faceRight ? 0 : Math.PI);
      for (var i = 0; i < 7; i++) {
        var sp = M.rand(90, 190), off = M.rand(-0.7, 0.7);
        G.FX.spawn(this.x + Math.cos(a) * 24, this.y + Math.sin(a) * 24, {
          vx: Math.cos(a + off) * sp, vy: Math.sin(a + off) * sp,
          life: 0.28, r: M.rand(2, 4), color: '#FFE9AE', shape: 'spark', a: a + off
        });
      }
      g.tutorial('attack');
    }
  }

  if (I.press('divine') && this.divineCd <= 0 && this.energy >= T.divineCost) {
    this.energy -= T.divineCost; this.divineCd = T.divineCd;
    G.Audio.sfx('divine');
    G.Camera.kick(6);
    g.shockwave(this.x, this.y, T.divineRadius, T.divineDmg);
    G.FX.burst(this.x, this.y, 34, { colors: ['#FFD97A', '#FFF7E6', '#F2A81D'], smin: 120, smax: 320, lmax: 0.7, shape: 'spark' });
    g.tutorial('divine');
  }

  if (I.press('assist') && this.assistCd <= 0 && g.companion) {
    if (g.companion.doAssist(g)) {
      this.assistCd = T.assistCd;
      g.tutorial('assist');
    }
  }
};

G.Player.prototype.throwTusk = function (g) {
  this.tuskThrown = true;
  this.atkCd = 0.6;
  G.Audio.sfx('tusk');
  G.Camera.kick(9);
  var a = this.facing || (this.faceRight ? 0 : Math.PI);
  g.projectiles.push(new G.Projectile({
    x: this.x + Math.cos(a) * 26, y: this.y + Math.sin(a) * 26,
    vx: Math.cos(a) * 620, vy: Math.sin(a) * 620,
    r: 16, dmg: 9999, owner: 'player', type: 'tusk', life: 2.2
  }));
};

G.Player.prototype.draw = function (ctx) {
  var a = {
    x: this.x, y: this.y, t: this.t, moving: this.moving,
    faceRight: this.faceRight, flash: this.flashT > 0 && Math.floor(this.flashT * 20) % 2 === 0
  };
  if (this.kind === 'mushak') {
    ctx.save();
    ctx.globalAlpha = 0.24 + Math.sin(this.t * 5) * 0.08;
    ctx.fillStyle = '#FFE9AE';
    ctx.beginPath();
    ctx.arc(this.x, this.y, 22, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
    G.Art.mushak(ctx, a);
  } else {
    a.attackArm = this.atkAnim > 0 ? -1.2 * (this.atkAnim / 0.22) : 0;
    a.tuskThrown = this.tuskThrown;
    G.Art.vinayaka(ctx, a);
  }
};

/* ------------------------------------------------------------ companion */
/* Companion stays with Vinayaka and is the key to the boss fight. */
G.Companion = function (x, y) {
  this.x = x; this.y = y; this.r = 12; this.t = 0;
  this.state = 'follow'; this.target = null; this.timer = 0;
  this.faceRight = true; this.moving = false;
};

G.Companion.prototype.doAssist = function (g) {
  if (this.state !== 'follow') return false;
  var best = null, bd = 1e9;
  for (var i = 0; i < g.enemies.length; i++) {
    var e = g.enemies[i];
    if (e.dead) continue;
    var d = M.dist2(this.x, this.y, e.x, e.y);
    if (d < bd) { bd = d; best = e; }
  }
  if (!best && g.boss && !g.boss.dead) best = g.boss;
  if (!best) return false;
  this.target = best; this.state = 'charge'; this.timer = 1.4;
  G.Audio.sfx('assist');
  return true;
};

G.Companion.prototype.update = function (dt, g) {
  this.t += dt;
  var lead = g.player;
  if (this.state === 'follow') {
    var tx = lead.x - (lead.faceRight ? 52 : -52), ty = lead.y + 26;
    var d = M.dist(this.x, this.y, tx, ty);
    this.moving = d > 6;
    if (d > 6) {
      var a = M.ang(this.x, this.y, tx, ty);
      var sp = Math.min(330, 90 + d * 3.2);
      this.x += Math.cos(a) * sp * dt;
      this.y += Math.sin(a) * sp * dt;
      this.faceRight = Math.cos(a) > 0;
    }
  } else if (this.state === 'charge') {
    this.timer -= dt;
    var tg = this.target;
    if (!tg || tg.dead || this.timer <= 0) { this.state = 'return'; this.timer = 1.2; return; }
    var a2 = M.ang(this.x, this.y, tg.x, tg.y);
    this.faceRight = Math.cos(a2) > 0;
    this.moving = true;
    this.x += Math.cos(a2) * 470 * dt;
    this.y += Math.sin(a2) * 470 * dt;
    G.FX.spawn(this.x, this.y, { vx: M.rand(-30, 30), vy: M.rand(-20, 20), life: 0.25, r: 3, color: '#FFF2CF' });
    if (M.dist(this.x, this.y, tg.x, tg.y) < tg.r + this.r + 4) {
      var T = G.Tune.vinayaka;
      tg.hurt(T.assistDmg, g, 'assist');
      if (tg.stun) tg.stun(T.assistStun, g);
      g.score.assists++;
      g.score.assistPoints += 40;
      G.Audio.sfx('hit');
      G.FX.burst(tg.x, tg.y, 16, { colors: ['#FFD97A', '#FFF7E6'], smax: 200, lmax: 0.5, shape: 'spark' });
      G.Camera.kick(4);
      this.state = 'return'; this.timer = 1.0;
    }
  } else { // return
    this.timer -= dt;
    var tx2 = lead.x - (lead.faceRight ? 52 : -52), ty2 = lead.y + 26;
    var a3 = M.ang(this.x, this.y, tx2, ty2);
    this.faceRight = Math.cos(a3) > 0;
    this.moving = true;
    this.x += Math.cos(a3) * 380 * dt;
    this.y += Math.sin(a3) * 380 * dt;
    if (M.dist(this.x, this.y, tx2, ty2) < 10 || this.timer <= 0) { this.state = 'follow'; this.target = null; }
  }
};

G.Companion.prototype.draw = function (ctx) {
  G.Art.mushak(ctx, {
    x: this.x, y: this.y, t: this.t, moving: this.moving,
    faceRight: this.faceRight, scale: 0.85, glow: this.state === 'charge'
  });
};

/* ---------------------------------------------------------------- enemy */
G.Enemy = function (type, x, y) {
  var T = G.Tune[type];
  this.type = type; this.heavy = type === 'heavy';
  this.x = x; this.y = y; this.r = T.r;
  this.hp = T.hp; this.maxHp = T.hp;
  this.t = M.rand(0, 6); this.state = 'idle'; this.timer = 0;
  this.dead = false; this.faceRight = true;
  this.stunT = 0; this.flashT = 0; this.aggro = 340;
  this.hitDone = false;
};

G.Enemy.prototype.stun = function (s, g) {
  this.stunT = Math.max(this.stunT, s);
  this.state = 'stunned'; this.timer = s;
};

G.Enemy.prototype.hurt = function (n, g, src) {
  if (this.dead) return;
  this.hp -= n; this.flashT = 0.18;
  G.Audio.sfx('hit');
  G.FX.burst(this.x, this.y - 10, 8, { colors: ['#FFD97A', '#B44BD6'], smax: 160, lmax: 0.45 });
  if (this.hp <= 0) {
    this.dead = true;
    g.score.kills++;
    g.score.killPoints += G.Tune[this.type].score;
    G.Audio.sfx('divine');
    G.FX.burst(this.x, this.y - 8, 26, { colors: ['#FFD97A', '#FFF7E6', '#B44BD6'], smin: 60, smax: 260, lmax: 0.9, shape: 'spark' });
    // asuras dissolve into light rather than falling
    for (var i = 0; i < 10; i++) {
      G.FX.spawn(this.x + M.rand(-16, 16), this.y + M.rand(-20, 10), {
        vx: M.rand(-12, 12), vy: M.rand(-70, -30), life: M.rand(0.6, 1.2), r: M.rand(2, 5), color: '#FFE9AE'
      });
    }
  }
};

G.Enemy.prototype.update = function (dt, g) {
  if (this.dead) return;
  this.t += dt;
  this.flashT = Math.max(0, this.flashT - dt);
  var p = g.player, T = G.Tune[this.type];
  var d = M.dist(this.x, this.y, p.x, p.y);
  this.faceRight = p.x > this.x;

  if (this.stunT > 0) {
    this.stunT -= dt;
    if (this.stunT <= 0) { this.state = 'idle'; }
    return;
  }

  switch (this.state) {
    case 'idle':
      if (d < this.aggro && !g.inputLocked()) this.state = 'chase';
      break;
    case 'chase':
      if (d > this.r + p.r + (this.heavy ? 26 : 12)) {
        var a = M.ang(this.x, this.y, p.x, p.y);
        moveAndCollide(this, Math.cos(a) * T.speed * dt, Math.sin(a) * T.speed * dt, g.level, false);
      } else {
        this.state = 'windup'; this.timer = T.windup; this.hitDone = false;
        this.lockA = M.ang(this.x, this.y, p.x, p.y);
      }
      break;
    case 'windup':
      this.timer -= dt;
      if (this.timer <= 0) {
        this.state = 'strike'; this.timer = this.heavy ? 0.42 : 0.3;
        if (this.heavy) {
          G.Audio.sfx('slam'); G.Camera.kick(5);
          G.FX.burst(this.x, this.y + 10, 20, { colors: ['#B44BD6', '#4A2C6B'], smax: 220, lmax: 0.6 });
        } else G.Audio.sfx('attack');
      }
      break;
    case 'strike':
      this.timer -= dt;
      if (this.heavy) {
        if (!this.hitDone) {
          this.hitDone = true;
          if (M.dist(this.x, this.y, p.x, p.y) < 86 + p.r) p.damage(T.dmg, g);
        }
      } else {
        moveAndCollide(this, Math.cos(this.lockA) * 420 * dt, Math.sin(this.lockA) * 420 * dt, g.level, false);
        if (!this.hitDone && M.dist(this.x, this.y, p.x, p.y) < this.r + p.r + 4) {
          this.hitDone = true;
          p.damage(T.dmg, g);
        }
      }
      if (this.timer <= 0) { this.state = 'recover'; this.timer = this.heavy ? 0.9 : 0.55; }
      break;
    case 'recover':
      this.timer -= dt;
      if (this.timer <= 0) this.state = 'chase';
      break;
  }
};

G.Enemy.prototype.draw = function (ctx) {
  if (this.dead) return;
  // telegraph
  if (this.state === 'windup') {
    var k = 1 - this.timer / G.Tune[this.type].windup;
    ctx.globalAlpha = 0.28 + 0.2 * k;
    ctx.fillStyle = '#FF8A3D';
    if (this.heavy) {
      ctx.beginPath(); ctx.arc(this.x, this.y + 8, 86 * (0.5 + k * 0.5), 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.lockA || 0);
      ctx.fillRect(0, -7, 120 * k, 14); ctx.restore();
    }
    ctx.globalAlpha = 1;
  }
  G.Art.asura(ctx, {
    x: this.x, y: this.y, t: this.t, faceRight: this.faceRight,
    heavy: this.heavy, windup: this.state === 'windup',
    stunned: this.stunT > 0, scale: this.flashT > 0 ? 1.08 : 1
  });
  // hp pip
  var w = this.heavy ? 54 : 36;
  ctx.fillStyle = 'rgba(0,0,0,0.45)';
  ctx.fillRect(this.x - w / 2, this.y - (this.heavy ? 58 : 42), w, 5);
  ctx.fillStyle = '#FF6B35';
  ctx.fillRect(this.x - w / 2, this.y - (this.heavy ? 58 : 42), w * Math.max(0, this.hp / this.maxHp), 5);
};

/* ----------------------------------------------------------- projectile */
G.Projectile = function (o) {
  this.x = o.x; this.y = o.y; this.vx = o.vx; this.vy = o.vy;
  this.r = o.r || 9; this.dmg = o.dmg || 10; this.owner = o.owner || 'enemy';
  this.life = o.life || 3; this.type = o.type || 'orb'; this.dead = false;
  this.t = 0;
};
G.Projectile.prototype.update = function (dt, g) {
  this.t += dt;
  this.life -= dt;
  if (this.life <= 0) { this.dead = true; return; }
  this.x += this.vx * dt; this.y += this.vy * dt;
  if (this.type === 'tusk') {
    G.FX.spawn(this.x, this.y, { vx: M.rand(-40, 40), vy: M.rand(-40, 40), life: 0.3, r: 4, color: '#FFE9AE' });
  }
  var L = g.level;
  if (this.x < L.x || this.y < L.y || this.x > L.x + L.w || this.y > L.y + L.h) { this.dead = true; return; }
  if (this.owner === 'enemy') {
    if (M.dist(this.x, this.y, g.player.x, g.player.y) < this.r + g.player.r) {
      g.player.damage(this.dmg, g); this.dead = true;
      G.FX.burst(this.x, this.y, 10, { color: '#B44BD6', smax: 140 });
    }
  } else {
    for (var i = 0; i < g.enemies.length; i++) {
      var e = g.enemies[i];
      if (e.dead) continue;
      if (M.dist(this.x, this.y, e.x, e.y) < this.r + e.r) { e.hurt(this.dmg, g, 'tusk'); this.dead = true; return; }
    }
    if (g.boss && !g.boss.dead && M.dist(this.x, this.y, g.boss.x, g.boss.y) < this.r + g.boss.r) {
      g.boss.hurt(this.dmg, g, this.type);
      this.dead = true;
    }
  }
};
G.Projectile.prototype.draw = function (ctx) {
  if (this.type === 'tusk') {
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(Math.atan2(this.vy, this.vx) + this.t * 14);
    ctx.fillStyle = '#FFF7E6';
    ctx.beginPath(); ctx.moveTo(-16, -5); ctx.lineTo(17, 0); ctx.lineTo(-16, 5); ctx.closePath(); ctx.fill();
    ctx.globalAlpha = 0.4; ctx.fillStyle = '#FFD97A';
    ctx.beginPath(); ctx.arc(0, 0, 18, 0, Math.PI * 2); ctx.fill();
    ctx.restore(); ctx.globalAlpha = 1;
  } else {
    ctx.globalAlpha = 0.3; ctx.fillStyle = '#B44BD6';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r * 2, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1; ctx.fillStyle = '#E4A6FF';
    ctx.beginPath(); ctx.arc(this.x, this.y, this.r, 0, Math.PI * 2); ctx.fill();
  }
};

/* -------------------------------------------------------------- hazards */
G.Hazard = function (o) {
  this.x = o.x; this.y = o.y; this.r = o.r || 22;
  this.type = o.type || 'vent';      // 'vent' pulses, 'sweeper' patrols
  this.dmg = o.dmg || 10;
  this.t = M.rand(0, 3); this.period = o.period || 2.2;
  this.ax = o.ax || 0; this.ay = o.ay || 0; this.range = o.range || 120; this.speed = o.speed || 90;
  this.ox = o.x; this.oy = o.y; this.dir = 1;
};
G.Hazard.prototype.update = function (dt, g) {
  this.t += dt;
  if (this.type === 'sweeper') {
    this.x += this.ax * this.speed * this.dir * dt;
    this.y += this.ay * this.speed * this.dir * dt;
    if (M.dist(this.x, this.y, this.ox, this.oy) > this.range) {
      this.dir *= -1;
      this.x = M.clamp(this.x, this.ox - Math.abs(this.ax) * this.range, this.ox + Math.abs(this.ax) * this.range);
      this.y = M.clamp(this.y, this.oy - Math.abs(this.ay) * this.range, this.oy + Math.abs(this.ay) * this.range);
    }
    this.active = true;
  } else {
    this.active = (this.t % this.period) < this.period * 0.42;
  }
  if (this.active && M.dist(this.x, this.y, g.player.x, g.player.y) < this.r + g.player.r) {
    g.player.damage(this.dmg, g);
  }
};
G.Hazard.prototype.draw = function (ctx) {
  var k = this.active ? 1 : 0.32;
  ctx.globalAlpha = 0.28 * k + 0.1;
  ctx.fillStyle = '#B44BD6';
  ctx.beginPath(); ctx.arc(this.x, this.y, this.r * (this.active ? 1.25 : 0.9), 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  if (this.type === 'sweeper') {
    ctx.fillStyle = '#E4A6FF';
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(this.t * 3);
    for (var i = 0; i < 4; i++) {
      ctx.rotate(Math.PI / 2);
      ctx.beginPath(); ctx.moveTo(0, -this.r); ctx.lineTo(5, 0); ctx.lineTo(-5, 0); ctx.closePath(); ctx.fill();
    }
    ctx.restore();
  } else {
    ctx.fillStyle = this.active ? '#E4A6FF' : '#6A3FA0';
    for (var j = 0; j < 5; j++) {
      var a = (j / 5) * Math.PI * 2 + this.t;
      var rr = this.r * (this.active ? 0.8 : 0.4);
      ctx.beginPath(); ctx.arc(this.x + Math.cos(a) * rr, this.y + Math.sin(a) * rr, 4, 0, Math.PI * 2); ctx.fill();
    }
  }
};

/* ----------------------------------------------------------------- boss */
G.Boss = function (x, y) {
  var T = G.Tune.boss;
  this.x = x; this.y = y; this.r = T.r;
  this.hp = T.hp; this.maxHp = T.hp;
  this.t = 0; this.dead = false; this.faceRight = false;
  this.phase = 1; this.state = 'idle'; this.timer = 1.2;
  this.stunT = 0; this.flashT = 0; this.vulnT = 0;
  this.rings = []; this.armSwing = 0; this.coreOpen = 0;
  this.defeated = false; this.intro = 2.0;
};

G.Boss.prototype.stun = function (s, g) {
  this.stunT = Math.max(this.stunT, s);
  this.state = 'stunned'; this.timer = s;
  if (this.phase >= 3) { this.vulnT = Math.max(this.vulnT, s + 1.4); }
  G.FX.burst(this.x, this.y - 30, 18, { colors: ['#FFD97A', '#FFF7E6'], smax: 200, lmax: 0.7, shape: 'spark' });
};

G.Boss.prototype.isVulnerable = function () {
  if (this.phase < 3) return true;
  return this.vulnT > 0;
};

G.Boss.prototype.hurt = function (n, g, src) {
  if (this.dead) return;
  if (this.phase === 4) {
    // only the tusk throw, landed while the core is open, ends the fight
    if (src === 'tusk' && this.coreOpen > 0) {
      this.hp = 0; this.dead = true; this.defeated = true;
      g.score.kills++; g.score.killPoints += G.Tune.boss.score;
      g.onBossDefeated();
      return;
    }
    this.flashT = 0.2;
    G.FX.burst(this.x, this.y - 20, 6, { color: '#6A3FA0', smax: 90 });
    return;
  }
  var mult = this.isVulnerable() ? 1 : 0.18;
  this.hp -= n * mult;
  this.flashT = 0.16;
  G.Audio.sfx('hit');
  G.FX.burst(this.x, this.y - 20, this.isVulnerable() ? 12 : 5, {
    colors: this.isVulnerable() ? ['#FFD97A', '#FFF7E6'] : ['#6A3FA0'], smax: 180, lmax: 0.5
  });
  if (!this.isVulnerable()) g.hintShield();
  var frac = this.hp / this.maxHp;
  var np = frac > 0.72 ? 1 : (frac > 0.46 ? 2 : (frac > 0.2 ? 3 : 4));
  if (np !== this.phase) this.setPhase(np, g);
};

G.Boss.prototype.setPhase = function (n, g) {
  this.phase = n;
  this.state = 'roar'; this.timer = 1.4; this.rings.length = 0;
  G.Audio.sfx('boss');
  G.Camera.kick(10);
  G.FX.burst(this.x, this.y - 20, 34, { colors: ['#B44BD6', '#FF6B35'], smin: 120, smax: 340, lmax: 0.9 });
  g.onBossPhase(n);
};

G.Boss.prototype.update = function (dt, g) {
  if (this.dead) return;
  this.t += dt;
  this.flashT = Math.max(0, this.flashT - dt);
  this.vulnT = Math.max(0, this.vulnT - dt);
  var p = g.player;
  this.faceRight = p.x > this.x;

  // expanding shockwave rings
  for (var i = this.rings.length - 1; i >= 0; i--) {
    var R = this.rings[i];
    R.r += R.speed * dt;
    R.life -= dt;
    if (!R.hit && Math.abs(M.dist(this.x, this.y, p.x, p.y) - R.r) < 26) {
      R.hit = true;
      p.damage(R.dmg, g);
    }
    if (R.life <= 0 || R.r > 700) this.rings.splice(i, 1);
  }

  if (this._pendingRing != null) {
    this._pendingRing -= dt;
    if (this._pendingRing <= 0) {
      this._pendingRing = null;
      this.rings.push({ r: 20, speed: 260, life: 2.2, dmg: 12, hit: false });
    }
  }

  if (this.intro > 0) { this.intro -= dt; return; }

  if (this.stunT > 0) {
    this.stunT -= dt;
    this.armSwing = M.lerp(this.armSwing, 0, dt * 4);
    this.clampToArena(g);
    return;
  }

  if (this.phase === 4) {
    // weakened: circles slowly, periodically exposing a glowing core
    this.coreOpen = Math.max(0, this.coreOpen - dt);
    this.timer -= dt;
    if (this.timer <= 0) {
      this.coreOpen = 2.4; this.timer = 5.2;
      G.Audio.sfx('bell');
      g.onCoreOpen();
    }
    var ang = M.ang(this.x, this.y, p.x, p.y);
    var want = 260;
    var d0 = M.dist(this.x, this.y, p.x, p.y);
    var sp = 55;
    if (d0 < want - 30) {
      this.x -= Math.cos(ang) * sp * dt;
      this.y -= Math.sin(ang) * sp * dt;
    } else if (d0 > want + 60) {
      this.x += Math.cos(ang) * (sp * 0.8) * dt;
      this.y += Math.sin(ang) * (sp * 0.8) * dt;
    }
    var tang = ang + Math.PI / 2;
    this.x += Math.cos(tang) * 22 * dt;
    this.y += Math.sin(tang) * 22 * dt;

    if (this.coreOpen <= 0 && this.t % 3 < dt * 2) {
      this.fireVolley(g, 3, 190);
    }
    this.clampToArena(g);
    return;
  }

  this.timer -= dt;
  switch (this.state) {
    case 'roar':
      if (this.timer <= 0) { this.state = 'idle'; this.timer = 0.6; }
      break;
    case 'idle': {
      var a = M.ang(this.x, this.y, p.x, p.y);
      var d = M.dist(this.x, this.y, p.x, p.y);
      // Actively approach Vinayaka until within engage distance (220px)
      if (d > 220) {
        this.x += Math.cos(a) * G.Tune.boss.speed * dt;
        this.y += Math.sin(a) * G.Tune.boss.speed * dt;
      }
      if (this.timer <= 0) this.chooseAttack(g);
      break;
    }
    case 'charge_tell':
      this.chargeA = M.ang(this.x, this.y, p.x, p.y);
      if (this.timer <= 0) {
        this.state = 'charge'; this.timer = 0.95; this.hitDone = false;
        G.Audio.sfx('slam');
      }
      break;
    case 'charge': {
      var cs = 520;
      moveAndCollide(this, Math.cos(this.chargeA) * cs * dt, Math.sin(this.chargeA) * cs * dt, g.level, false);
      G.FX.spawn(this.x, this.y + 30, { vx: M.rand(-40, 40), vy: M.rand(-30, 10), life: 0.35, r: M.rand(3, 7), color: '#6A3FA0' });
      if (!this.hitDone && M.dist(this.x, this.y, p.x, p.y) < this.r + p.r + 6) {
        this.hitDone = true; p.damage(18, g); G.Camera.kick(9);
      }
      if (this.timer <= 0) { this.state = 'recover'; this.timer = 1.1; }
      break;
    }
    case 'slam_tell':
      this.armSwing = M.lerp(this.armSwing, -0.9, dt * 6);
      if (this.timer <= 0) {
        this.state = 'slam'; this.timer = 0.5; this.armSwing = 0.6;
        G.Audio.sfx('slam'); G.Camera.kick(12);
        if (M.dist(this.x, this.y, p.x, p.y) < 140) p.damage(16, g);
        this.rings.push({ r: 40, speed: 300, life: 2.0, dmg: 14, hit: false });
        if (this.phase >= 2) setTimeoutRing(this, 0.35);
        G.FX.burst(this.x, this.y + 40, 30, { colors: ['#B44BD6', '#FF6B35'], smax: 320, lmax: 0.8 });
      }
      break;
    case 'slam':
      this.armSwing = M.lerp(this.armSwing, 0, dt * 5);
      if (this.timer <= 0) { this.state = 'recover'; this.timer = 1.0; }
      break;
    case 'volley_tell':
      if (this.timer <= 0) {
        this.state = 'volley'; this.timer = 0.9; this.shots = this.phase >= 3 ? 3 : 2; this.shotT = 0;
      }
      break;
    case 'volley':
      this.shotT -= dt;
      if (this.shotT <= 0 && this.shots > 0) {
        this.shots--; this.shotT = 0.3;
        this.fireVolley(g, this.phase >= 2 ? 5 : 3, 230);
      }
      if (this.timer <= 0) { this.state = 'recover'; this.timer = 0.9; }
      break;
    case 'summon':
      if (this.timer <= 0) {
        for (var s = 0; s < 2; s++) {
          var aa = M.rand(0, Math.PI * 2);
          var e = new G.Enemy('small', this.x + Math.cos(aa) * 150, this.y + Math.sin(aa) * 150);
          e.state = 'chase';
          g.enemies.push(e);
          G.FX.burst(e.x, e.y, 16, { color: '#B44BD6', smax: 200 });
        }
        this.state = 'recover'; this.timer = 1.0;
      }
      break;
    case 'reposition':
      this.x += this.repoVx * dt;
      this.y += this.repoVy * dt;
      if (this.timer <= 0) {
        this.state = 'idle';
        this.timer = this.phase >= 3 ? 0.6 : 0.9;
      }
      break;
    case 'recover':
      this.armSwing = M.lerp(this.armSwing, 0, dt * 5);
      if (this.timer <= 0) {
        if (Math.random() < 0.4) {
          this.state = 'reposition';
          this.timer = 0.5;
          var tang2 = M.ang(this.x, this.y, p.x, p.y) + (Math.random() < 0.5 ? 1 : -1) * (Math.PI / 2);
          this.repoVx = Math.cos(tang2) * 85;
          this.repoVy = Math.sin(tang2) * 85;
        } else {
          this.state = 'idle';
          this.timer = this.phase >= 3 ? 0.6 : 0.9;
        }
      }
      break;
  }
  this.clampToArena(g);
};

G.Boss.prototype.clampToArena = function (g) {
  var L = g ? g.level : null;
  if (!L) return;
  var pad = this.r + 36;
  this.x = M.clamp(this.x, L.x + pad, L.x + L.w - pad);
  this.y = M.clamp(this.y, L.y + pad, L.y + L.h - pad);
};

function setTimeoutRing(boss, delay) {
  boss._pendingRing = delay;
}

G.Boss.prototype.fireVolley = function (g, n, speed) {
  var base = M.ang(this.x, this.y, g.player.x, g.player.y);
  for (var i = 0; i < n; i++) {
    var a = base + (i - (n - 1) / 2) * 0.24;
    g.projectiles.push(new G.Projectile({
      x: this.x + Math.cos(a) * 40, y: this.y + Math.sin(a) * 40,
      vx: Math.cos(a) * speed, vy: Math.sin(a) * speed,
      r: 11, dmg: 12, owner: 'enemy', life: 4
    }));
  }
  G.Audio.sfx('attack');
};

G.Boss.prototype.chooseAttack = function (g) {
  var d = M.dist(this.x, this.y, g.player.x, g.player.y);
  if (d > 420) {
    var longOpts = ['charge', 'volley'];
    if (this.phase >= 3) longOpts.push('summon');
    var pickL = M.pick(longOpts);
    if (pickL === 'charge') { this.state = 'charge_tell'; this.timer = 0.8; }
    else if (pickL === 'volley') { this.state = 'volley_tell'; this.timer = 0.55; }
    else { this.state = 'summon'; this.timer = 0.9; G.Audio.sfx('boss'); }
    return;
  }
  if (d > 220) {
    var midOpts = ['charge', 'volley'];
    var pickM = M.pick(midOpts);
    if (pickM === 'charge') { this.state = 'charge_tell'; this.timer = 0.75; }
    else { this.state = 'volley_tell'; this.timer = 0.55; }
    return;
  }
  var closeOpts = ['slam', 'slam', 'charge'];
  var pickC = M.pick(closeOpts);
  if (pickC === 'slam') { this.state = 'slam_tell'; this.timer = 0.75; }
  else { this.state = 'charge_tell'; this.timer = 0.65; }
};

G.Boss.prototype.draw = function (ctx) {
  if (this.dead) return;
  // ground telegraphs
  if (this.state === 'charge_tell') {
    var a = this.chargeA || 0;
    ctx.save(); ctx.translate(this.x, this.y); ctx.rotate(a);
    ctx.globalAlpha = 0.3 + 0.2 * Math.sin(this.t * 22);
    ctx.fillStyle = '#FF8A3D'; ctx.fillRect(0, -34, 460, 68);
    ctx.restore(); ctx.globalAlpha = 1;
  }
  if (this.state === 'slam_tell') {
    ctx.globalAlpha = 0.28 + 0.22 * Math.sin(this.t * 20);
    ctx.fillStyle = '#FF8A3D';
    ctx.beginPath(); ctx.arc(this.x, this.y + 20, 132, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
  for (var i = 0; i < this.rings.length; i++) {
    var R = this.rings[i];
    ctx.globalAlpha = Math.max(0, Math.min(0.75, R.life));
    ctx.strokeStyle = '#FF6B35'; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(this.x, this.y, R.r, 0, Math.PI * 2); ctx.stroke();
    ctx.strokeStyle = '#B44BD6'; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(this.x, this.y, R.r - 9, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  G.Art.boss(ctx, {
    x: this.x, y: this.y, t: this.t, faceRight: this.faceRight,
    scale: 1 + (this.flashT > 0 ? 0.03 : 0),
    windup: this.state.indexOf('_tell') >= 0,
    vulnerable: this.isVulnerable() && this.phase >= 3,
    armSwing: this.armSwing
  });

  if (this.coreOpen > 0) {
    var pulse = 0.55 + Math.sin(this.t * 10) * 0.35;
    ctx.globalAlpha = pulse;
    ctx.fillStyle = '#FFD97A';
    ctx.beginPath(); ctx.arc(this.x, this.y - 6, 30, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 0.9; ctx.strokeStyle = '#FFF7E6'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(this.x, this.y - 6, 38 + Math.sin(this.t * 8) * 4, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
  if (this.phase >= 3 && !this.isVulnerable()) {
    ctx.globalAlpha = 0.25 + 0.1 * Math.sin(this.t * 4);
    ctx.strokeStyle = '#9B6BD6'; ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(this.x, this.y - 6, this.r + 26, 0, Math.PI * 2); ctx.stroke();
    ctx.globalAlpha = 1;
  }
};
