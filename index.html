/* =========================================================================
   40_ui.js  -  HUD, dialogue box, objective banner, toasts, on-screen
   controls and all menu screens. Drawn on the same canvas as the game.
   ========================================================================= */
var M = G.math;
var P = G.Palette;

G.Font = {
  display: function (size) { return '400 ' + size + 'px "Yatra One", "Trebuchet MS", serif'; },
  body: function (size, weight) { return (weight || 500) + ' ' + size + 'px "Mukta", "Segoe UI", sans-serif'; }
};

G.UI = {
  toasts: [], objective: '', objectiveT: 0, objectivePulse: 0,
  dialogue: null, dialogueIdx: 0, dialogueChars: 0, dialogueDone: null,
  hintT: 0, hint: '',

  reset: function () {
    this.toasts.length = 0; this.objective = ''; this.objectiveT = 0;
    this.dialogue = null; this.dialogueIdx = 0; this.dialogueChars = 0; this.dialogueDone = null;
    this.hintT = 0;
  },

  /* ------------------------------------------------------------ helpers */
  roundRect: function (ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
  panel: function (ctx, x, y, w, h, alpha) {
    ctx.globalAlpha = alpha == null ? 0.82 : alpha;
    ctx.fillStyle = '#20140B';
    this.roundRect(ctx, x, y, w, h, 14); ctx.fill();
    ctx.globalAlpha = 1;
    ctx.strokeStyle = P.gold; ctx.lineWidth = 2;
    this.roundRect(ctx, x + 3, y + 3, w - 6, h - 6, 11); ctx.stroke();
  },
  /* keycap for desktop control guides */
  keycap: function (ctx, x, y, label, active) {
    ctx.font = G.Font.body(11, 700);
    var tw = ctx.measureText(label).width;
    var w = Math.max(26, tw + 14), h = 22;
    ctx.save();
    ctx.globalAlpha = 0.35; ctx.fillStyle = '#000';
    this.roundRect(ctx, x - w / 2 + 1, y - h / 2 + 2, w, h, 4); ctx.fill();
    ctx.globalAlpha = 1;
    var g = ctx.createLinearGradient(x, y - h / 2, x, y + h / 2);
    if (active) { g.addColorStop(0, '#FFE9AE'); g.addColorStop(1, P.gold); }
    else { g.addColorStop(0, '#322014'); g.addColorStop(1, '#1A1008'); }
    ctx.fillStyle = g;
    this.roundRect(ctx, x - w / 2, y - h / 2, w, h, 4); ctx.fill();
    ctx.strokeStyle = active ? '#FFF7E6' : 'rgba(242,168,29,0.7)'; ctx.lineWidth = 1.2;
    this.roundRect(ctx, x - w / 2, y - h / 2, w, h, 4); ctx.stroke();
    this.text(ctx, label, x, y + 4, G.Font.body(11, 700), active ? '#2B1A08' : '#FFD97A', 'center');
    ctx.restore();
    return w;
  },
  text: function (ctx, str, x, y, font, color, align, baseline) {
    ctx.font = font; ctx.fillStyle = color;
    ctx.textAlign = align || 'left'; ctx.textBaseline = baseline || 'alphabetic';
    ctx.fillText(str, x, y);
    ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  },
  wrap: function (ctx, str, maxW) {
    var words = String(str).split(' '), lines = [], cur = '';
    for (var i = 0; i < words.length; i++) {
      var test = cur ? cur + ' ' + words[i] : words[i];
      if (ctx.measureText(test).width > maxW && cur) { lines.push(cur); cur = words[i]; }
      else cur = test;
    }
    if (cur) lines.push(cur);
    return lines;
  },

  /* ------------------------------------------------------------- toasts */
  toast: function (msg) {
    this.toasts.push({ msg: msg, life: 4.2, max: 4.2 });
    if (this.toasts.length > 3) this.toasts.shift();
  },
  setObjective: function (text, flash) {
    this.objective = text;
    if (flash) { this.objectivePulse = 1.6; G.Audio.sfx('ui'); }
  },
  hintShield: function () {
    if (this.hintT > 0) return;
    this.hintT = 2.6;
    this.hint = 'His guard holds. Send Companion in first.';
  },

  /* ----------------------------------------------------------- dialogue */
  say: function (lines, done) {
    this.dialogue = lines; this.dialogueIdx = 0; this.dialogueChars = 0;
    this.dialogueDone = done || null;
  },
  dialogueOpen: function () { return !!this.dialogue; },
  advanceDialogue: function () {
    var line = this.dialogue[this.dialogueIdx];
    if (this.dialogueChars < line.text.length) {
      this.dialogueChars = line.text.length;   // first press completes the line
      return;
    }
    this.dialogueIdx++;
    this.dialogueChars = 0;
    G.Audio.sfx('ui');
    if (this.dialogueIdx >= this.dialogue.length) {
      this.dialogue = null;
      var d = this.dialogueDone; this.dialogueDone = null;
      if (d) d();
    }
  },

  update: function (dt) {
    for (var i = this.toasts.length - 1; i >= 0; i--) {
      this.toasts[i].life -= dt;
      if (this.toasts[i].life <= 0) this.toasts.splice(i, 1);
    }
    this.objectivePulse = Math.max(0, this.objectivePulse - dt);
    this.hintT = Math.max(0, this.hintT - dt);
    if (this.dialogue) {
      var line = this.dialogue[this.dialogueIdx];
      if (line && this.dialogueChars < line.text.length) this.dialogueChars += dt * 58;
      var I = G.Input;
      var playing = !G.Game || G.Game.state === 'play';
      if (playing && (I.press('interact') || I.press('attack') || I.press('dodge') || I.pointer.justDown)) {
        this.advanceDialogue();
      }
    }
  },

  /* ---------------------------------------------------------------- HUD */
  bar: function (ctx, x, y, w, h, frac, col, bg) {
    ctx.fillStyle = bg || 'rgba(0,0,0,0.5)';
    this.roundRect(ctx, x, y, w, h, h / 2); ctx.fill();
    ctx.fillStyle = col;
    if (frac > 0) { this.roundRect(ctx, x + 2, y + 2, Math.max(4, (w - 4) * M.clamp(frac, 0, 1)), h - 4, (h - 4) / 2); ctx.fill(); }
  },

  drawHUD: function (ctx, g) {
    var p = g.player;
    // chapter strip
    ctx.globalAlpha = 0.72; ctx.fillStyle = '#1B1109';
    ctx.fillRect(0, 0, G.W, 44); ctx.globalAlpha = 1;
    ctx.fillStyle = P.gold; ctx.fillRect(0, 43, G.W, 2);

    this.text(ctx, g.level.chapter + ' \u00b7 ' + g.level.name, 16, 28, G.Font.body(15, 600), 'rgba(255,247,230,0.78)');

    // score, right
    this.text(ctx, String(g.currentScore()), G.W - 16, 30, G.Font.display(22), P.goldLt, 'right');
    this.text(ctx, 'punya', G.W - 16, 42, G.Font.body(11, 500), 'rgba(255,247,230,0.5)', 'right');

    // health / energy, below strip
    var hx = 16, hy = 56;
    this.bar(ctx, hx, hy, 190, 14, p.hp / p.maxHp, p.hp / p.maxHp < 0.3 ? '#FF5C33' : '#D6432F');
    this.text(ctx, Math.ceil(p.hp) + '/' + p.maxHp, hx + 196, hy + 12, G.Font.body(12, 600), 'rgba(255,247,230,0.75)');

    if (p.kind === 'vinayaka') {
      this.bar(ctx, hx, hy + 20, 190, 10, p.energy / G.Tune.vinayaka.maxEnergy, '#7FC7FF');
      // assist cooldown
      var cd = p.assistCd, full = G.Tune.vinayaka.assistCd;
      var ax = hx, ay = hy + 38;
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      this.roundRect(ctx, ax, ay, 190, 16, 8); ctx.fill();
      ctx.fillStyle = cd > 0 ? 'rgba(255,217,122,0.35)' : P.goldLt;
      this.roundRect(ctx, ax + 2, ay + 2, Math.max(4, 186 * (1 - cd / full)), 12, 6); ctx.fill();
      this.text(ctx, cd > 0 ? 'Companion returning ' + cd.toFixed(1) + 's' : 'Companion ready',
        ax + 8, ay + 13, G.Font.body(11, 600), cd > 0 ? 'rgba(255,247,230,0.8)' : '#2B1A08');
    }

    // objective
    if (this.objective) {
      var pulse = this.objectivePulse > 0 ? 1 : 0;
      ctx.save();
      ctx.font = G.Font.body(15, 600);
      var w = ctx.measureText(this.objective).width + 34;
      var ox = G.W / 2 - w / 2, oy = 54;
      ctx.globalAlpha = 0.8 + pulse * 0.2;
      ctx.fillStyle = pulse ? 'rgba(242,168,29,0.92)' : 'rgba(27,17,9,0.8)';
      this.roundRect(ctx, ox, oy, w, 28, 14); ctx.fill();
      ctx.globalAlpha = 1;
      this.text(ctx, this.objective, G.W / 2, oy + 19, G.Font.body(15, 600), pulse ? '#2B1A08' : '#FFF7E6', 'center');
      ctx.restore();
    }

    // toasts
    for (var i = 0; i < this.toasts.length; i++) {
      var t = this.toasts[i], a = Math.min(1, t.life / 0.6);
      ctx.globalAlpha = a * 0.92;
      ctx.font = G.Font.body(14, 500);
      var tw = ctx.measureText(t.msg).width + 26;
      var tx = G.W / 2 - tw / 2, ty = 98 + i * 34;
      ctx.fillStyle = 'rgba(20,12,6,0.85)';
      this.roundRect(ctx, tx, ty, tw, 26, 13); ctx.fill();
      this.text(ctx, t.msg, G.W / 2, ty + 18, G.Font.body(14, 500), '#FFE9AE', 'center');
      ctx.globalAlpha = 1;
    }

    if (this.hintT > 0) {
      ctx.globalAlpha = Math.min(1, this.hintT);
      this.text(ctx, this.hint, G.W / 2, 150, G.Font.body(16, 600), '#FFD97A', 'center');
      ctx.globalAlpha = 1;
    }

    // interaction prompt
    if (g.nearInteract) {
      var label = g.nearInteract.label + (G.Input.touchUsed ? '' : '   [E]');
      ctx.font = G.Font.body(14, 600);
      var pw = ctx.measureText(label).width + 26;
      var px = G.W / 2 - pw / 2, py = G.H - (G.Input.touchUsed ? 200 : 96);
      ctx.fillStyle = 'rgba(242,168,29,0.94)';
      this.roundRect(ctx, px, py, pw, 28, 14); ctx.fill();
      this.text(ctx, label, G.W / 2, py + 19, G.Font.body(14, 600), '#2B1A08', 'center');
    }

    // boss bar
    if (g.boss && !g.boss.dead) {
      var bw = 520, bx = G.W / 2 - bw / 2, by = G.H - 40;
      ctx.fillStyle = 'rgba(0,0,0,0.55)';
      this.roundRect(ctx, bx - 4, by - 4, bw + 8, 26, 12); ctx.fill();
      var frac = Math.max(0, g.boss.hp / g.boss.maxHp);
      ctx.fillStyle = g.boss.phase === 4 ? P.goldLt : (g.boss.isVulnerable() ? '#FF6B35' : '#6A3FA0');
      this.roundRect(ctx, bx, by, bw * frac, 18, 9); ctx.fill();
      // phase ticks
      ctx.fillStyle = 'rgba(255,247,230,0.5)';
      [0.2, 0.46, 0.72].forEach(function (t2) { ctx.fillRect(bx + bw * t2, by, 2, 18); });
      var names = ['', 'Strength', 'Pressure', 'Cooperation', 'The Final Moment'];
      this.text(ctx, 'Gajamukhasura \u00b7 ' + names[g.boss.phase], G.W / 2, by - 10,
        G.Font.body(13, 600), '#FFE9AE', 'center');
      if (g.boss.phase === 4 && g.player.tuskReady && !g.player.tuskThrown) {
        var ready = g.boss.coreOpen > 0;
        this.text(ctx, ready ? 'The core is open  -  ATTACK to release the tusk' : 'Wait for the core to open',
          G.W / 2, by + 36, G.Font.body(15, 700), ready ? '#FFD97A' : 'rgba(255,247,230,0.6)', 'center');
      }
    }
  },

  /* --------------------------------------------------- dialogue drawing */
  drawDialogue: function (ctx) {
    if (!this.dialogue) return;
    var line = this.dialogue[this.dialogueIdx];
    if (!line) return;
    var h = 128, y = G.H - h - 14, x = 60, w = G.W - 120;
    this.panel(ctx, x, y, w, h, 0.9);
    // portrait medallion
    ctx.save();
    ctx.beginPath(); ctx.arc(x + 54, y + h / 2, 38, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(242,168,29,0.16)'; ctx.fill();
    ctx.clip();
    var t = performance && performance.now ? performance.now() / 1000 : 0;
    var who = line.name;
    if (who === 'Mushak' || who === 'Companion') G.Art.mushak(ctx, { x: x + 52, y: y + h / 2 + 8, t: t, scale: 1.25, faceRight: true });
    else if (who === 'Vinayaka') G.Art.vinayaka(ctx, { x: x + 54, y: y + h / 2 + 22, t: t, scale: 0.92, faceRight: true, aura: 0.1 });
    else if (who === 'Parvati') G.Art.parvati(ctx, { x: x + 54, y: y + h / 2 + 18, t: t, scale: 0.78 });
    else G.Art.asura(ctx, { x: x + 54, y: y + h / 2 + 14, t: t, scale: 0.95, heavy: true, faceRight: true });
    ctx.restore();
    ctx.strokeStyle = P.gold; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(x + 54, y + h / 2, 38, 0, Math.PI * 2); ctx.stroke();

    this.text(ctx, line.name, x + 110, y + 34, G.Font.display(21), P.goldLt);
    ctx.font = G.Font.body(17, 500);
    var shown = line.text.substring(0, Math.floor(this.dialogueChars));
    var lines = this.wrap(ctx, shown, w - 150);
    for (var i = 0; i < lines.length && i < 3; i++) {
      this.text(ctx, lines[i], x + 110, y + 62 + i * 24, G.Font.body(17, 500), '#F6EBD8');
    }
    if (this.dialogueChars >= line.text.length) {
      var blink = Math.sin((t) * 6) > 0;
      if (blink) this.text(ctx, G.Input.touchUsed ? 'tap to continue' : 'press E', x + w - 22, y + h - 16,
        G.Font.body(13, 600), 'rgba(255,217,122,0.85)', 'right');
    }
  },

  /* ---------------------------------------------- on-screen touch pad */
  layoutTouch: function (g) {
    var I = G.Input;
    I.buttons.length = 0;
    if (!g || !g.player) return;
    var visible = I.touchUsed;
    var rightX = G.W - 86, baseY = G.H - 86;
    function btn(action, label, x, y, r, color) {
      I.buttons.push({ action: action, label: label, x: x, y: y, r: r, color: color, visible: visible, held: false, id: null });
    }
    if (g.player.kind === 'mushak') {
      btn('dodge', 'DASH', rightX, baseY, 40, '#F2A81D');
      btn('interact', 'USE', rightX - 96, baseY - 12, 36, '#D6432F');
    } else {
      btn('attack', 'HIT', rightX, baseY, 42, '#F2A81D');
      btn('divine', 'DIVINE', rightX - 92, baseY - 26, 36, '#7FC7FF');
      btn('dodge', 'DODGE', rightX - 26, baseY - 96, 34, '#F3E3C3');
      btn('assist', 'ALLY', rightX - 118, baseY - 104, 34, '#D6432F');
    }
    // pause button is always tappable
    I.buttons.push({ action: 'pause', label: 'II', x: G.W - 26, y: 22, r: 18, color: '#F3E3C3', visible: true, held: false, id: null });
  },

  drawTouch: function (ctx, g) {
    var I = G.Input;
    // joystick
    if (I.touchUsed) {
      var jx = I.joy.active ? I.joy.bx : 110, jy = I.joy.active ? I.joy.by : G.H - 100;
      ctx.globalAlpha = I.joy.active ? 0.38 : 0.2;
      ctx.fillStyle = '#FFF7E6';
      ctx.beginPath(); ctx.arc(jx, jy, I.joy.radius, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = I.joy.active ? 0.85 : 0.4;
      ctx.fillStyle = P.gold;
      ctx.beginPath(); ctx.arc(jx + I.joy.dx, jy + I.joy.dy, 26, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
    }
    for (var i = 0; i < I.buttons.length; i++) {
      var b = I.buttons[i];
      if (!b.visible) continue;
      var cd = 0;
      if (g && g.player) {
        if (b.action === 'assist') cd = g.player.assistCd / G.Tune.vinayaka.assistCd;
        if (b.action === 'dodge') cd = g.player.dashCd / (g.player.kind === 'mushak' ? G.Tune.mushak.dashCd : G.Tune.vinayaka.dodgeCd);
        if (b.action === 'divine') cd = g.player.energy < G.Tune.vinayaka.divineCost ? 1 : 0;
      }
      ctx.globalAlpha = b.held ? 0.95 : 0.62;
      ctx.fillStyle = cd > 0 ? 'rgba(40,26,14,0.8)' : b.color;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = 'rgba(255,247,230,0.85)'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.stroke();
      this.text(ctx, b.label, b.x, b.y + 4, G.Font.body(Math.max(10, b.r * 0.32), 700),
        cd > 0 ? 'rgba(255,247,230,0.55)' : '#2B1A08', 'center');
    }
  },

  /* -------------------------------------------------------------- menus */
  /* A menu is a list of {label, action, value}. Pointer + keyboard. */
  Menu: function (items) {
    this.items = items; this.index = 0; this.hover = -1;
  }
};

G.UI.Menu.prototype.hitAt = function (x, y, layout) {
  for (var i = 0; i < this.items.length; i++) {
    var r = layout(i);
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return i;
  }
  return -1;
};

G.UI.Menu.prototype.update = function (layout) {
  var I = G.Input;
  if (I.press('up')) { this.index = (this.index + this.items.length - 1) % this.items.length; G.Audio.sfx('ui'); }
  if (I.press('down')) { this.index = (this.index + 1) % this.items.length; G.Audio.sfx('ui'); }
  var h = this.hitAt(I.pointer.x, I.pointer.y, layout);
  this.hover = h;
  if (h >= 0) this.index = h;
  if (I.press('interact') || (I.pointer.justDown && h >= 0)) {
    G.Audio.sfx('ui');
    var it = this.items[this.index];
    if (it && it.action) it.action();
    return true;
  }
  return false;
};

G.UI.Menu.prototype.draw = function (ctx, layout) {
  for (var i = 0; i < this.items.length; i++) {
    var r = layout(i), it = this.items[i], sel = i === this.index;
    ctx.globalAlpha = sel ? 1 : 0.86;
    ctx.fillStyle = sel ? P.gold : 'rgba(27,17,9,0.78)';
    G.UI.roundRect(ctx, r.x, r.y, r.w, r.h, 10); ctx.fill();
    ctx.strokeStyle = sel ? '#FFF7E6' : 'rgba(242,168,29,0.6)'; ctx.lineWidth = 2;
    G.UI.roundRect(ctx, r.x, r.y, r.w, r.h, 10); ctx.stroke();
    var label = it.label + (it.value ? '   ' + it.value() : '');
    G.UI.text(ctx, label, r.x + r.w / 2, r.y + r.h / 2 + 6, G.Font.body(18, 600),
      sel ? '#2B1A08' : '#F6EBD8', 'center');
    ctx.globalAlpha = 1;
  }
};

var M = G.math;
var P = G.Palette;

G.Game = {
  state: 'boot',
  t: 0, chapterIndex: 0,
  level: null, player: null, companion: null,
  enemies: [], projectiles: [], swings: [], waves: [], boss: null,
  nearInteract: null, fade: 0, fadeDir: 0, pending: null,
  switchFx: 0, switchTo: '', seqIdx: 0, seqTimer: 0, seqStarted: false,
  tutorialSeen: {}, endFlash: 0, retries: 0,

  score: null,

  /* ------------------------------------------------------------- score */
  newScore: function () {
    return {
      modaks: 0, flowers: 0, durva: 0, divine: 0,
      kills: 0, killPoints: 0, assists: 0, assistPoints: 0,
      damage: 0, startT: 0, elapsed: 0, retries: 0
    };
  },
  currentScore: function () {
    var s = this.score;
    if (!s) return 0;
    var v = s.modaks * 50 + s.flowers * 30 + s.durva * 20 + s.divine * 90 +
      s.killPoints + s.assistPoints - Math.round(s.damage * 6) - s.retries * 250;
    return Math.max(0, v);
  },
  finalScore: function () {
    var s = this.score;
    var base = this.currentScore();
    var mins = s.elapsed / 60;
    var timeBonus = Math.max(0, Math.round((22 - mins) * 120));
    var noHit = s.damage === 0 ? 1500 : 0;
    return { base: base, timeBonus: timeBonus, noHit: noHit, total: base + timeBonus + noHit };
  },
  stars: function (total) { return total >= 9000 ? 3 : (total >= 6000 ? 2 : 1); },

  /* -------------------------------------------------------------- boot */
  init: function (canvas, ctx, view) {
    this.canvas = canvas; this.ctx = ctx; this.view = view;

    }
  },

  /* ------------------------------------------- divine opening animation (8-15s) */
  drawDivineIntro: function (ctx) {
    var t = this.animT; // 0 to 11.0s
    ctx.fillStyle = '#080512';
    ctx.fillRect(0, 0, G.W, G.H);

    // Sacred background atmosphere: subtle temple floor and warm divine ambience
    var grd = ctx.createRadialGradient(G.W / 2, G.H / 2 + 20, 20, G.W / 2, G.H / 2 + 20, G.H * 0.75);
    grd.addColorStop(0, 'rgba(85,45,20,0.38)');
    grd.addColorStop(1, 'rgba(6,3,14,0.96)');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, G.W, G.H);

    // Floor ground shadow
    var groundY = 320;
    G.Env.shadowEllipse(ctx, G.W / 2, groundY + 28, 48, 14, 0.35);

    var floatY = 0;
    var scaleX = 1;
    var glowIntensity = 0;
    var neckGlow = 0;

    if (t < 2.0) {
      neckGlow = t / 2.0;
      glowIntensity = 0.2 * neckGlow;
    } else if (t < 4.5) {
      var p = (t - 2.0) / 2.5;
      neckGlow = 1.0;
      glowIntensity = 0.2 + 0.5 * p;
      floatY = -38 * (0.5 - 0.5 * Math.cos(p * Math.PI));
    } else if (t < 9.0) {
      neckGlow = 1.0;
      glowIntensity = 0.7 + 0.15 * Math.sin((t - 4.5) * 4);
      floatY = -38;
      var rotProg = (t - 4.5) / 4.5;
      var rotAngle = rotProg * Math.PI * 2;
      scaleX = Math.cos(rotAngle);
    } else if (t < 10.5) {
      var d = (t - 9.0) / 1.5;
      scaleX = 1;
      floatY = -38 * (1 - (0.5 - 0.5 * Math.cos(d * Math.PI)));
      glowIntensity = 0.7 * (1 - d * 0.6);
      neckGlow = 1.0 - d * 0.5;
    } else {
      scaleX = 1;
      floatY = 0;
      glowIntensity = 0.25;
      neckGlow = 0.3;
    }

    // Divine rays expanding from behind
    if (glowIntensity > 0.15) {
      ctx.save();
      ctx.translate(G.W / 2, groundY + floatY - 20);
      ctx.rotate(t * 0.12);
      for (var r = 0; r < 12; r++) {
        ctx.rotate(Math.PI / 6);
        ctx.globalAlpha = glowIntensity * 0.12;
        ctx.fillStyle = '#FFE9AE';
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(24, 280);
        ctx.lineTo(-24, 280);
        ctx.closePath();
        ctx.fill();
      }
      ctx.restore();
    }

    // Soft divine glow around neck and head region (step 2 & 3)
    if (neckGlow > 0) {
      ctx.save();
      var rad = 25 + neckGlow * 38;
      var nGrd = ctx.createRadialGradient(G.W / 2, groundY + floatY - 34, 5, G.W / 2, groundY + floatY - 34, rad);
      nGrd.addColorStop(0, 'rgba(255,233,174,' + (neckGlow * 0.85) + ')');
      nGrd.addColorStop(0.5, 'rgba(242,168,29,' + (neckGlow * 0.45) + ')');
      nGrd.addColorStop(1, 'rgba(242,168,29,0)');
      ctx.fillStyle = nGrd;
      ctx.beginPath();
      ctx.arc(G.W / 2, groundY + floatY - 34, rad, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // Golden divine particles
    if (glowIntensity > 0.2) {
      ctx.save();
      for (var pt = 0; pt < 18; pt++) {
        var pAngle = pt * 1.35 + t * 1.8;
        var pDist = 25 + ((pt * 27 + t * 45) % 95);
        var px = G.W / 2 + Math.cos(pAngle) * pDist * 1.1;
        var py = groundY + floatY - 20 + Math.sin(pAngle) * pDist * 0.7 - ((t * 15 + pt * 5) % 40);
        ctx.globalAlpha = Math.min(1, glowIntensity * (1 - (pDist / 120)));
        ctx.fillStyle = pt % 2 === 0 ? '#FFE9AE' : '#FFD97A';
        ctx.beginPath();
        ctx.arc(px, py, 2.5 + (pt % 3), 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.restore();
    }

    // Draw Vinayaka with horizontal rotation around vertical axis (step 5)
    ctx.save();
    var curScaleX = Math.abs(scaleX) < 0.08 ? (scaleX < 0 ? -0.08 : 0.08) : scaleX;
    G.Art.vinayaka(ctx, {
      x: G.W / 2,
      y: groundY + floatY,
      t: t,
      faceRight: true,
      scale: 1.55,
      scaleX: curScaleX * 1.55
    });
    ctx.restore();

    // Subtle skip label
    G.UI.text(ctx, 'Space / Tap to skip', G.W - 30, G.H - 20, G.Font.body(12, 500), 'rgba(255,247,230,0.4)', 'right');
  },

  updateDivineIntro: function (dt) {
    this.animT += dt;
    var I = G.Input;
    if (this.animT >= 11.0 || I.press('dodge') || I.press('interact') || (I.pointer.justDown && I.pointer.y > G.H - 60)) {
      this.finishDivineIntro();
    }
  },

  startNewGame: function () {
    this.score = this.newScore();
    this.score.startT = this.t;
    this.chapterIndex = 0;
    this.retries = 0;
    this.tutorialSeen = {};
    this.loadChapter(0);
    this.state = 'play';
  },

  loadChapter: function (i) {
    this.chapterIndex = i;
    var factory = G.Chapters[i];
    var L = factory();
    L.index = i;
    this.level = L;
    this.enemies.length = 0; this.projectiles.length = 0;
    this.swings.length = 0; this.waves.length = 0;
    this.boss = null; this.nearInteract = null;
    this.seqIdx = 0; this.seqTimer = 0; this.seqStarted = false;
    G.Timers.clear();
    G.FX.reset();
    G.UI.reset();

    this.player = new G.Player(L.char, L.start.x, L.start.y);
    if (L.char === 'vinayaka') {
      this.companion = new G.Companion(L.start.x - 50, L.start.y + 26);
    } else this.companion = null;

    G.Camera.bounds = { x: L.x, y: L.y, w: L.w, h: L.h };
    G.Camera.snap(this.player.x, this.player.y);

    if (L.isBoss) {
      this.boss = new G.Boss(L.bossSpawn.x, L.bossSpawn.y);
    }
    if (L.enemies) {
      for (var e = 0; e < L.enemies.length; e++) this.spawnEnemy(L.enemies[e].type, L.enemies[e].x, L.enemies[e].y);
    }
    if (L.hazards) {
      this.hazards = [];
      for (var h = 0; h < L.hazards.length; h++) this.hazards.push(new G.Hazard(L.hazards[h]));
    } else this.hazards = [];

    G.UI.layoutTouch(this);
    G.Audio.music(L.music || 'divine');
    if (L.onEnter) L.onEnter(this);
    this.fade = 1; this.fadeDir = -1;
  },

  completeChapter: function () {
    if (this.pending) return;
    var next = this.chapterIndex + 1;
    if (next >= G.Chapters.length) { this.finishGame(); return; }
    var nextChar = null;
    try { nextChar = G.Chapters[next]().char; } catch (e) { nextChar = null; }
    var self = this;
    this.pending = function () {
      if (nextChar && nextChar !== self.level.char) {
        self.switchFx = 1.1; self.switchTo = nextChar;
        G.Audio.sfx('switch');
      }
      self.loadChapter(next);
    };
    this.fadeDir = 1;
    G.Audio.sfx('bell');
  },

  retryChapter: function () {
    this.score.retries++;
    this.retries++;
    var i = this.chapterIndex, self = this;
    this.pending = function () { self.loadChapter(i); };
    this.fadeDir = 1;
    this.state = 'play';
  },

  onPlayerDown: function () {
    var self = this;
    G.Audio.sfx('lose');
    G.Audio.stopMusic();
    setTimeoutSafe(function () { self.state = 'defeat'; self.menuDefeat.index = 0; }, 700);
  },

  finishGame: function () {
    this.score.elapsed = this.t - this.score.startT;
    var f = this.finalScore();
    var st = this.stars(f.total);
    if (f.total > G.Save.data.best) { G.Save.data.best = f.total; G.Save.data.bestStars = st; }
    G.Save.data.runs++;
    G.Save.save();
    this.finalResult = f;
    this.state = 'score';
    this.menuScore.index = 0;
    G.Audio.music(null);
    G.Audio.sfx('win');
  },

  /* ------------------------------------------------------------- helpers */
  inputLocked: function () {
    return G.UI.dialogueOpen() || this.state !== 'play' || (this.level && this.level.cutscene) || this.switchFx > 0;
  },
  aliveEnemies: function () {
    var n = 0;
    for (var i = 0; i < this.enemies.length; i++) if (!this.enemies[i].dead) n++;
    return n;
  },
  spawnEnemy: function (type, x, y) {
    var e = new G.Enemy(type, x, y);
    this.enemies.push(e);
    G.FX.burst(x, y, 16, { colors: ['#B44BD6', '#4A2C6B'], smax: 180, lmax: 0.6 });
    return e;
  },
  say: function (lines, done) { G.UI.say(lines, done); },
  toast: function (msg) { G.UI.toast(msg); },
  setObjective: function (text, flash) { G.UI.setObjective(text, flash); },
  hintShield: function () { G.UI.hintShield(); },
  tutorial: function (key) { this.tutorialSeen[key] = true; },

  swing: function (s) {
    this.swings.push({ x: s.x, y: s.y, angle: s.angle, range: s.range, arc: s.arc, life: 0.16, max: 0.16 });
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (e.dead) continue;
      if (G.hit.inArc(s.x, s.y, s.angle, s.range, s.arc, e.x, e.y, e.r)) e.hurt(s.dmg, this, s.source);
    }
    if (this.boss && !this.boss.dead && G.hit.inArc(s.x, s.y, s.angle, s.range, s.arc, this.boss.x, this.boss.y, this.boss.r)) {
      this.boss.hurt(s.dmg, this, s.source);
    }
  },

  shockwave: function (x, y, radius, dmg) {
    this.waves.push({ x: x, y: y, r: 10, max: radius, life: 0.45 });
    for (var i = 0; i < this.enemies.length; i++) {
      var e = this.enemies[i];
      if (!e.dead && M.dist(x, y, e.x, e.y) < radius + e.r) e.hurt(dmg, this, 'divine');
    }
    if (this.boss && !this.boss.dead && M.dist(x, y, this.boss.x, this.boss.y) < radius + this.boss.r) {
      this.boss.hurt(dmg, this, 'divine');
    }
  },

  tryInteract: function () {
    if (!this.nearInteract) return;
    var o = this.nearInteract;
    if (o.once !== false) o.used = true;
    if (this.level.onInteract) this.level.onInteract(this, o);
    G.Audio.sfx('ui');
  },

  onBossPhase: function (n) {
    var g = this;
    if (n === 2 && this.level && this.level.id === 'boss') {
      this.spawnBossHealingOrb();
    }
    if (n === 3) {
      this.toast('His guard closes. Companion must break it open');
      G.UI.hintShield();
      if (this.level && this.level.id === 'boss') {
        this.spawnBossHealingOrb();
      }
    }
    if (n === 4) {
      this.player.tuskReady = true;
      this.toast('He is weakened. Strike when the core opens');
      this.say([{ name: 'Vinayaka', text: 'Now, Companion. One throw, and this ends without blood.' }]);
    }
  },
  spawnBossHealingOrb: function () {
    var L = this.level;
    if (!L) return;
    if (L.healOrbsSpawned == null) L.healOrbsSpawned = 2;
    if (L.healOrbsSpawned >= 4) return;

    var activeOrbs = 0;
    for (var i = 0; i < L.pickups.length; i++) {
      if (L.pickups[i].kind === 'heal_orb' && !L.pickups[i].taken) activeOrbs++;
    }
    if (activeOrbs >= 2) return;

    var nodes = [
      { x: 550, y: 400 }, { x: 550, y: 800 },
      { x: 1210, y: 400 }, { x: 1210, y: 800 }
    ];
    var best = nodes[0], bestDist = -1;
    for (var j = 0; j < nodes.length; j++) {
      var d = this.boss ? M.dist(nodes[j].x, nodes[j].y, this.boss.x, this.boss.y) : 500;
      if (d > bestDist) { bestDist = d; best = nodes[j]; }
    }
    L.pickups.push(pk('heal_orb', best.x, best.y));
    L.healOrbsSpawned++;
    this.toast('A restorative healing orb has appeared');
    G.FX.burst(best.x, best.y, 22, { colors: ['#34D399', '#6EE7B7', '#FEF08A'], smax: 200, lmax: 0.8 });
  },
  onCoreOpen: function () {
    this.toast('The core is open');
    G.Camera.kick(4);
  },
  onBossDefeated: function () {
    var self = this;
    this.endFlash = 1.4;
    G.Camera.kick(14);
    G.Audio.sfx('win');
    G.FX.burst(this.boss.x, this.boss.y - 20, 90, {
      colors: ['#FFD97A', '#FFF7E6', '#F2A81D'], smin: 80, smax: 420, lmax: 1.8, shape: 'spark'
    });
    setTimeoutSafe(function () { self.completeChapter(); }, 1800);
  },

  /* -------------------------------------------------------------- update */
  update: function (dt) {
    this.t += dt;
    G.Timers.update(dt);
    G.Input.update();
    G.UI.update(dt);
    G.FX.update(dt);
    G.Camera.update(dt);
    this.endFlash = Math.max(0, this.endFlash - dt);

    // fade / chapter hand-off
    if (this.fadeDir !== 0) {
      this.fade = M.clamp(this.fade + this.fadeDir * dt * 2.4, 0, 1);
      if (this.fadeDir > 0 && this.fade >= 1 && this.pending) {
        var p = this.pending; this.pending = null; p();
      } else if (this.fadeDir < 0 && this.fade <= 0) this.fadeDir = 0;
    }
    if (this.switchFx > 0) this.switchFx = Math.max(0, this.switchFx - dt);

    switch (this.state) {
      case 'menu':
      case 'howto':
      case 'settings':
      case 'defeat':
      case 'score':
        this.updateScreens();
        break;
      case 'rules':
        this.updateRules();
        break;
      case 'divine_intro':
        this.updateDivineIntro(dt);
        break;
      case 'pause':
        this.updatePause();
        break;
      case 'play':
        if (G.Input.press('pause')) { this.state = 'pause'; this.menuPause.index = 0; G.Audio.sfx('ui'); break; }
        this.updatePlay(dt);
        break;
    }
    G.Input.endFrame();
  },

  updatePlay: function (dt) {
    var L = this.level;
    if (!L) return;
    if (this.score) this.score.elapsed = this.t - this.score.startT;

    // while a line of dialogue or a character switch holds the player still,
    // nothing hostile moves either
    var frozen = G.UI.dialogueOpen() || this.switchFx > 0;

    this.player.update(dt, this);
    if (this.companion) this.companion.update(dt, this);

    if (!frozen) {
      for (var i = 0; i < this.enemies.length; i++) this.enemies[i].update(dt, this);
      for (var h = 0; h < this.hazards.length; h++) this.hazards[h].update(dt, this);
      if (this.boss) this.boss.update(dt, this);
    }

    for (var j = this.projectiles.length - 1; j >= 0; j--) {
      var pr = this.projectiles[j];
      pr.update(dt, this);
      if (pr.dead) {
        // a tusk that does not end the fight comes back to him
        if (pr.type === 'tusk' && this.boss && !this.boss.dead && this.player.tuskThrown) {
          this.player.tuskThrown = false;
          this.toast('The tusk returns to his hand');
          G.FX.burst(this.player.x, this.player.y - 20, 12, { colors: ['#FFF7E6', '#FFD97A'], smax: 140, lmax: 0.6 });
        }
        this.projectiles.splice(j, 1);
      }
    }
    for (var s = this.swings.length - 1; s >= 0; s--) {
      this.swings[s].life -= dt;
      if (this.swings[s].life <= 0) this.swings.splice(s, 1);
    }
    for (var w = this.waves.length - 1; w >= 0; w--) {
      var wv = this.waves[w];
      wv.life -= dt;
      wv.r = M.lerp(wv.r, wv.max, Math.min(1, dt * 9));
      if (wv.life <= 0) this.waves.splice(w, 1);
    }

    // on-screen controls follow the active character and appear on first touch
    var layoutKey = this.player.kind + (G.Input.touchUsed ? ':touch' : ':keys');
    if (layoutKey !== this._layoutKey) { this._layoutKey = layoutKey; G.UI.layoutTouch(this); }

    // pickups
    for (var k = 0; k < L.pickups.length; k++) {
      var pu = L.pickups[k];
      if (pu.taken) continue;
      if (M.dist(pu.x, pu.y, this.player.x, this.player.y) < 30 + this.player.r) {
        pu.taken = true;
        this.collect(pu);
      }
    }

    // interactables
    this.nearInteract = null;
    for (var n = 0; n < L.interactables.length; n++) {
      var o = L.interactables[n];
      if (o.used) continue;
      if (o.enabled && !o.enabled(this)) continue;
      if (M.dist(o.x, o.y, this.player.x, this.player.y) < o.r) { this.nearInteract = o; break; }
    }

    // exits
    for (var x = 0; x < L.exits.length; x++) {
      var ex = L.exits[x];
      if (ex.active === false) continue;
      if (this.player.x > ex.x && this.player.x < ex.x + ex.w &&
        this.player.y > ex.y && this.player.y < ex.y + ex.h) {
        this.completeChapter();
      }
    }

    // scripted cutscene chapters
    if (L.seq) this.runSeq(dt);

    if (L.onUpdate) L.onUpdate(this, dt);

    G.Camera.follow(this.player, dt);
    if (this.boss && !this.boss.dead) {
      // widen framing during the boss fight
      G.Camera.x = M.lerp(G.Camera.x, (this.player.x * 2 + this.boss.x) / 3, Math.min(1, dt * 3));
      G.Camera.y = M.lerp(G.Camera.y, (this.player.y * 2 + this.boss.y) / 3, Math.min(1, dt * 3));
      G.Camera.clamp();
    }
  },

  runSeq: function (dt) {
    var L = this.level;
    if (this.seqIdx >= L.seq.length) return;
    var step = L.seq[this.seqIdx];
    if (step.type === 'wait') {
      if (!this.seqStarted) { this.seqStarted = true; this.seqTimer = step.t; }
      this.seqTimer -= dt;
      if (this.seqTimer <= 0) { this.seqIdx++; this.seqStarted = false; }
    } else if (step.type === 'say') {
      if (!this.seqStarted) {
        this.seqStarted = true;
        var self = this;
        G.UI.say(step.lines, function () { self.seqIdx++; self.seqStarted = false; });
      }
    } else if (step.type === 'do') {
      step.fn(this);
      this.seqIdx++; this.seqStarted = false;
    }
  },

  collect: function (pu) {
    var s = this.score;
    G.Audio.sfx(pu.kind === 'modak' || pu.kind === 'heal_orb' ? 'modak' : 'pickup');
    var colors = {
      modak: ['#FFD97A', '#F2A81D'],
      flower: ['#F2A81D', '#D6432F'],
      durva: ['#5DA97C', '#2F7D5B'],
      divine: ['#FFF7E6', '#FFD97A'],
      energy: ['#7FC7FF', '#CFF4FF'],
      heal_orb: ['#34D399', '#6EE7B7', '#FEF08A']
    };
    G.FX.burst(pu.x, pu.y, 16, { colors: colors[pu.kind] || ['#FFD97A'], smax: 180, lmax: 0.7, grav: -35 });
    if (pu.kind === 'modak') { s.modaks++; this.player.heal(8); }
    else if (pu.kind === 'flower') s.flowers++;
    else if (pu.kind === 'durva') s.durva++;
    else if (pu.kind === 'divine') { s.divine++; this.player.heal(14); }
    else if (pu.kind === 'energy') {
      if (this.player.kind === 'vinayaka') this.player.energy = M.clamp(this.player.energy + 40, 0, G.Tune.vinayaka.maxEnergy);
      this.player.heal(10);
    }
    else if (pu.kind === 'heal_orb') {
      this.player.heal(22);
      G.Audio.sfx('bell');
      this.toast('+22 Health recovered');
    }
  },

  updatePause: function () {
    var g = this;
    if (this.confirmRestart || this.confirmQuit) {
      var yes = G.Input.press('interact');
      var lay = this.confirmLayout;
      var idx = -1;
      if (G.Input.pointer.justDown) {
        for (var i = 0; i < 2; i++) {
          var r = lay(i);
          if (G.Input.pointer.x > r.x && G.Input.pointer.x < r.x + r.w &&
            G.Input.pointer.y > r.y && G.Input.pointer.y < r.y + r.h) idx = i;
        }
      }
      if (G.Input.press('pause')) { this.confirmRestart = this.confirmQuit = false; return; }
      if (idx === 0 || (yes && this.confirmIndex === 0)) {
        if (this.confirmRestart) { this.confirmRestart = false; this.retryChapter(); }
        else { this.confirmQuit = false; this.toMenu(); }
        return;
      }
      if (idx === 1 || (yes && this.confirmIndex === 1)) { this.confirmRestart = this.confirmQuit = false; return; }
      if (G.Input.press('left')) this.confirmIndex = 0;
      if (G.Input.press('right')) this.confirmIndex = 1;
      if (this.confirmIndex == null) this.confirmIndex = 1;
      return;
    }
    if (G.Input.press('pause')) { this.state = 'play'; return; }
    this.menuPause.update(this.menuLayout(this.menuPause, 250));
  },

  updateScreens: function () {
    if (this.state === 'menu') {
      this.menuMain.update(this.menuLayout(this.menuMain, 330));
    } else if (this.state === 'settings') {
      this.menuSettings.update(this.menuLayout(this.menuSettings, 170, 44, 10, 420));
      if (G.Input.press('pause')) { this.state = this.prevState === 'pause' ? 'pause' : 'menu'; this.prevState = null; }
    } else if (this.state === 'howto') {
      if (G.Input.press('interact') || G.Input.press('pause') || G.Input.pointer.justDown) {
        this.state = this.prevState === 'pause' ? 'pause' : 'menu';
        this.prevState = null;
        G.Audio.sfx('ui');
      }
    } else if (this.state === 'defeat') {
      this.menuDefeat.update(this.menuLayout(this.menuDefeat, 330));
    } else if (this.state === 'score') {
      this.menuScore.update(this.menuLayout(this.menuScore, 452, 40, 10, 300));
    }
  },

  menuLayout: function (menu, top, h, gap, w) {
    h = h || 46; gap = gap || 12; w = w || 330;
    return function (i) {
      return { x: G.W / 2 - w / 2, y: top + i * (h + gap), w: w, h: h };
    };
  },
  confirmLayout: function (i) {
    return { x: G.W / 2 + (i === 0 ? -170 : 10), y: 330, w: 160, h: 44 };
  },

  /* --------------------------------------------------------------- draw */
  draw: function (ctx) {
    ctx.save();
    ctx.fillStyle = '#0D081C';
    ctx.fillRect(0, 0, G.W, G.H);

    if (this.state === 'play' || this.state === 'pause' || this.state === 'defeat') {
      this.drawWorld(ctx);
    } else if (this.state === 'menu') {
      this.drawMenu(ctx);
    } else if (this.state === 'rules') {
      this.drawRules(ctx);
    } else if (this.state === 'divine_intro') {
      this.drawDivineIntro(ctx);
    } else if (this.state === 'howto') {
      this.drawHowTo(ctx);
    } else if (this.state === 'settings') {
      this.drawSettings(ctx);
    } else if (this.state === 'score') {
      this.drawScore(ctx);
    }

    if (this.state === 'pause') this.drawPause(ctx);
    if (this.state === 'defeat') this.drawDefeat(ctx);

    // character switch flourish
    if (this.switchFx > 0) {
      var k = this.switchFx / 1.1;
      ctx.globalAlpha = Math.min(0.85, k);
      ctx.fillStyle = '#FFD97A';
      ctx.fillRect(0, 0, G.W, G.H);
      ctx.globalAlpha = 1;
      G.UI.text(ctx, this.switchTo === 'vinayaka' ? 'Vinayaka steps forward' : 'Mushak takes the lead',
        G.W / 2, G.H / 2, G.Font.display(30), '#2B1A08', 'center');
    }
    if (this.endFlash > 0) {
      ctx.globalAlpha = Math.min(0.9, this.endFlash);
      ctx.fillStyle = '#FFF7E6'; ctx.fillRect(0, 0, G.W, G.H);
      ctx.globalAlpha = 1;
    }
    if (this.fade > 0) {
      ctx.globalAlpha = this.fade;
      ctx.fillStyle = '#0D081C'; ctx.fillRect(0, 0, G.W, G.H);
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  },

  drawWorld: function (ctx) {
    var L = this.level;
    if (!L) return;
    ctx.save();
    G.Camera.apply(ctx);
    G.Env.drawGround(ctx, L, G.Camera, this.t);

    // barrier / corridor boundary indicators
    if (L.walls) {
      for (var wi = 0; wi < L.walls.length; wi++) {
        var bw = L.walls[wi];
        if (bw.isBarrier || (!bw.prop && !bw.ref && !bw.mouseOnly)) {
          G.Env.drawBarrier(ctx, bw, this.t, this.player);
        }
      }
    }

    // exits
    for (var x = 0; x < L.exits.length; x++) {
      var ex = L.exits[x];
      if (ex.active === false) continue;
      ctx.globalAlpha = 0.3 + 0.15 * Math.sin(this.t * 3);
      ctx.fillStyle = P.goldLt;
      ctx.fillRect(ex.x, ex.y, ex.w, ex.h);
      ctx.globalAlpha = 1;
      ctx.strokeStyle = P.gold; ctx.lineWidth = 3;
      ctx.strokeRect(ex.x, ex.y, ex.w, ex.h);
      G.UI.text(ctx, 'onward', ex.x + ex.w / 2, ex.y - 10, G.Font.body(13, 600), '#FFE9AE', 'center');
    }

    // interactable markers
    for (var n = 0; n < L.interactables.length; n++) {
      var o = L.interactables[n];
      if (o.used) continue;
      if (o.enabled && !o.enabled(this)) continue;
      ctx.globalAlpha = 0.24 + 0.12 * Math.sin(this.t * 3 + n);
      ctx.fillStyle = P.goldLt;
      ctx.beginPath(); ctx.arc(o.x, o.y, 26, 0, Math.PI * 2); ctx.fill();
      ctx.globalAlpha = 1;
      ctx.strokeStyle = P.gold; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(o.x, o.y, 26, 0, Math.PI * 2); ctx.stroke();
      G.UI.text(ctx, '!', o.x, o.y + 7, G.Font.display(20), P.white, 'center');
    }

    // shockwaves
    for (var w = 0; w < this.waves.length; w++) {
      var wv = this.waves[w];
      ctx.globalAlpha = Math.max(0, wv.life * 1.8);
      ctx.strokeStyle = '#FFE9AE'; ctx.lineWidth = 14;
      ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r, 0, Math.PI * 2); ctx.stroke();
      ctx.strokeStyle = '#F2A81D'; ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(wv.x, wv.y, wv.r * 0.8, 0, Math.PI * 2); ctx.stroke();
      ctx.globalAlpha = 1;
    }

    // on-screen controls follow the active character and appear on first touch
    var layoutKey = this.player.kind + (G.Input.touchUsed ? ':touch' : ':keys');
    if (layoutKey !== this._layoutKey) { this._layoutKey = layoutKey; G.UI.layoutTouch(this); }

    // depth-sorted scenery, actors, and pickups
    var draws = [];
    for (var k = 0; k < L.pickups.length; k++) {
      var pk = L.pickups[k];
      if (!pk.taken) {
        draws.push({ y: pk.y + 6, fn: (function (pkk) { return function () { G.Art.pickup(ctx, pkk, G.Game.t); }; })(pk) });
      }
    }
    for (var pi = 0; pi < L.props.length; pi++) {
      var pr = L.props[pi];
      draws.push({ y: pr.y + (pr.h || 40), fn: (function (p2) { return function () { G.Env.drawProp(ctx, p2, G.Game.t); }; })(pr) });
    }
    for (var ni = 0; ni < L.npcs.length; ni++) {
      var np = L.npcs[ni];
      draws.push({ y: np.y, fn: (function (n2) { return function () { G.Art.parvati(ctx, { x: n2.x, y: n2.y, t: G.Game.t, scale: 1.25 }); }; })(np) });
    }
    for (var hi = 0; hi < this.hazards.length; hi++) {
      var hz = this.hazards[hi];
      draws.push({ y: hz.y, fn: (function (h2) { return function () { h2.draw(ctx); }; })(hz) });
    }
    for (var ei = 0; ei < this.enemies.length; ei++) {
      var en = this.enemies[ei];
      if (en.dead) continue;
      draws.push({ y: en.y, fn: (function (e2) { return function () { e2.draw(ctx); }; })(en) });
    }
    if (this.boss && !this.boss.dead) {
      var bo = this.boss;
      draws.push({ y: bo.y, fn: function () { bo.draw(ctx); } });
    }
    if (L.vahana) {
      var vh = L.vahana;
      draws.push({ y: vh.y, fn: function () { G.Art.vahanaMouse(ctx, { x: vh.x, y: vh.y, t: vh.t, scale: vh.scale, faceRight: false }); } });
    }
    if (L.vinayaka) {
      var vk = L.vinayaka;
      draws.push({ y: vk.y, fn: function () { G.Art.vinayaka(ctx, { x: vk.x, y: vk.y, t: vk.t, faceRight: true }); } });
    }
    var pl = this.player;
    draws.push({ y: pl.y, fn: function () { pl.draw(ctx); } });
    if (this.companion) {
      var co = this.companion;
      draws.push({ y: co.y, fn: function () { co.draw(ctx); } });
    }
    draws.sort(function (a, b) { return a.y - b.y; });
    for (var d = 0; d < draws.length; d++) draws[d].fn();

    // melee arcs
    for (var s = 0; s < this.swings.length; s++) {
      var sw = this.swings[s], kk = sw.life / sw.max;
      ctx.globalAlpha = kk * 0.65;
      ctx.fillStyle = '#FFE9AE';
      ctx.beginPath();
      ctx.moveTo(sw.x, sw.y);
      ctx.arc(sw.x, sw.y, sw.range, sw.angle - sw.arc / 2, sw.angle + sw.arc / 2);
      ctx.closePath(); ctx.fill();
      ctx.globalAlpha = 1;
    }

    for (var pj = 0; pj < this.projectiles.length; pj++) this.projectiles[pj].draw(ctx);

    G.FX.draw(ctx);
    ctx.restore();

    // vignette for the darker realms
    if (L.theme === 'asura' || L.theme === 'arena' || L.theme === 'cavern') {
      var grd = ctx.createRadialGradient(G.W / 2, G.H / 2, G.H * 0.35, G.W / 2, G.H / 2, G.H * 0.8);
      grd.addColorStop(0, 'rgba(0,0,0,0)');
      grd.addColorStop(1, 'rgba(8,4,16,0.7)');
      ctx.fillStyle = grd; ctx.fillRect(0, 0, G.W, G.H);
    }

    G.UI.drawHUD(ctx, this);
    G.UI.drawTouch(ctx, this);
    G.UI.drawDialogue(ctx);
  },

  /* ------------------------------------------------------- title screen */
  drawMenu: function (ctx) {
    var t = this.t;
    var grd = ctx.createLinearGradient(0, 0, 0, G.H);
    grd.addColorStop(0, '#2B1A45'); grd.addColorStop(0.55, '#7A3A2E'); grd.addColorStop(1, '#F2A81D');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, G.W, G.H);

    // sun disc behind the title
    ctx.globalAlpha = 0.25;
    ctx.fillStyle = '#FFD97A';
    ctx.beginPath(); ctx.arc(G.W / 2, 210, 150 + Math.sin(t) * 6, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
    // rays
    ctx.save(); ctx.translate(G.W / 2, 210); ctx.rotate(t * 0.06);
    for (var i = 0; i < 16; i++) {
      ctx.rotate(Math.PI / 8);
      ctx.globalAlpha = 0.10;
      ctx.fillStyle = '#FFF7E6';
      ctx.beginPath(); ctx.moveTo(0, -150); ctx.lineTo(16, -320); ctx.lineTo(-16, -320); ctx.closePath(); ctx.fill();
    }
    ctx.restore(); ctx.globalAlpha = 1;

    G.Art.vinayaka(ctx, { x: G.W / 2 - 96, y: 250, t: t, faceRight: true, scale: 1.5 });
    G.Art.mushak(ctx, { x: G.W / 2 + 74, y: 282, t: t, faceRight: false, scale: 1.5 });

    G.UI.text(ctx, 'Mushak & Vinayaka', G.W / 2, 118, G.Font.display(52), '#FFF7E6', 'center');
    G.UI.text(ctx, 'The Vahana\u2019s Journey', G.W / 2, 152, G.Font.body(21, 600), '#FFD97A', 'center');

    this.menuMain.draw(ctx, this.menuLayout(this.menuMain, 330));

    var best = G.Save.data.best;
    if (best > 0) {
      G.UI.text(ctx, 'Best journey: ' + best.toLocaleString() + '  ' + '\u2605'.repeat(G.Save.data.bestStars || 1),
        G.W / 2, G.H - 24, G.Font.body(14, 600), 'rgba(43,26,8,0.85)', 'center');
    } else {
      G.UI.text(ctx, 'A Ganesh Chaturthi adventure', G.W / 2, G.H - 24, G.Font.body(14, 600), 'rgba(43,26,8,0.8)', 'center');
    }
  },

  drawHowTo: function (ctx) {
    ctx.fillStyle = '#1B1023'; ctx.fillRect(0, 0, G.W, G.H);
    G.UI.text(ctx, 'How to play', G.W / 2, 66, G.Font.display(36), '#FFD97A', 'center');
    var lines = [
      ['Companion', 'Move with WASD, the arrows, or the joystick. Space dashes. E interacts.'],
      ['Vinayaka', 'J strikes. K spends energy on a divine wave. Space dodges with a moment of safety.'],
      ['Companion assist', 'L sends Companion in to stun an asura. It is the only way through Gajamukhasura\u2019s guard.'],
      ['The tusk', 'Held back until the boss is weakened, then thrown when his core opens.'],
      ['Scoring', 'Modaks, flowers, durva and divine marks all count. Damage and retries cost you.'],
      ['Pause', 'ESC on a keyboard, or the button in the corner on a touch screen.']
    ];
    for (var i = 0; i < lines.length; i++) {
      var y = 130 + i * 62;
      G.UI.text(ctx, lines[i][0], 90, y, G.Font.display(20), '#F2A81D');
      ctx.font = G.Font.body(16, 500);
      var wrapped = G.UI.wrap(ctx, lines[i][1], 620);
      for (var j = 0; j < wrapped.length; j++) {
        G.UI.text(ctx, wrapped[j], 300, y + j * 22, G.Font.body(16, 500), '#F6EBD8');
      }
    }
    G.UI.text(ctx, 'Press E, tap, or press ESC to go back', G.W / 2, G.H - 26, G.Font.body(15, 600), 'rgba(255,247,230,0.7)', 'center');
  },

  drawSettings: function (ctx) {
    ctx.fillStyle = '#1B1023'; ctx.fillRect(0, 0, G.W, G.H);
    G.UI.text(ctx, 'Settings', G.W / 2, 96, G.Font.display(36), '#FFD97A', 'center');
    this.menuSettings.draw(ctx, this.menuLayout(this.menuSettings, 170, 44, 10, 420));
    G.UI.text(ctx, 'Settings are kept on this device', G.W / 2, G.H - 26, G.Font.body(14, 500), 'rgba(255,247,230,0.6)', 'center');
  },

  drawPause: function (ctx) {
    ctx.globalAlpha = 0.72; ctx.fillStyle = '#0D081C'; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1;
    G.UI.text(ctx, 'Paused', G.W / 2, 170, G.Font.display(40), '#FFD97A', 'center');
    if (this.confirmRestart || this.confirmQuit) {
      G.UI.text(ctx, this.confirmRestart ? 'Restart this chapter?' : 'Leave for the main menu?',
        G.W / 2, 290, G.Font.body(20, 600), '#FFF7E6', 'center');
      G.UI.text(ctx, 'Your journey so far will be lost',
        G.W / 2, 318, G.Font.body(14, 500), 'rgba(255,247,230,0.7)', 'center');
      for (var i = 0; i < 2; i++) {
        var r = this.confirmLayout(i), sel = (this.confirmIndex || 1) === i;
        ctx.fillStyle = sel ? P.gold : 'rgba(27,17,9,0.8)';
        G.UI.roundRect(ctx, r.x, r.y, r.w, r.h, 10); ctx.fill();
        ctx.strokeStyle = 'rgba(242,168,29,0.7)'; ctx.lineWidth = 2;
        G.UI.roundRect(ctx, r.x, r.y, r.w, r.h, 10); ctx.stroke();
        G.UI.text(ctx, i === 0 ? 'Yes' : 'Keep playing', r.x + r.w / 2, r.y + 28,
          G.Font.body(17, 600), sel ? '#2B1A08' : '#F6EBD8', 'center');
      }
      return;
    }
    this.menuPause.draw(ctx, this.menuLayout(this.menuPause, 250));
  },

  drawDefeat: function (ctx) {
    ctx.globalAlpha = 0.8; ctx.fillStyle = '#1A0A0A'; ctx.fillRect(0, 0, G.W, G.H); ctx.globalAlpha = 1;
    G.UI.text(ctx, 'Journey interrupted', G.W / 2, 190, G.Font.display(42), '#FF8A3D', 'center');
    G.UI.text(ctx, this.level && this.level.isBoss ? 'The battle begins again, not the journey' : 'You start again from ' + (this.level ? this.level.name : 'here'),
      G.W / 2, 240, G.Font.body(17, 500), 'rgba(255,247,230,0.8)', 'center');
    G.UI.text(ctx, 'Each retry costs 250 punya', G.W / 2, 268, G.Font.body(14, 500), 'rgba(255,247,230,0.55)', 'center');
    this.menuDefeat.draw(ctx, this.menuLayout(this.menuDefeat, 330));
  },

  drawScore: function (ctx) {
    var grd = ctx.createLinearGradient(0, 0, 0, G.H);
    grd.addColorStop(0, '#2B1A45'); grd.addColorStop(1, '#8C4A1E');
    ctx.fillStyle = grd; ctx.fillRect(0, 0, G.W, G.H);
    var s = this.score, f = this.finalResult || this.finalScore();
    var stars = this.stars(f.total);

    G.UI.text(ctx, 'Journey complete', G.W / 2, 74, G.Font.display(42), '#FFF7E6', 'center');
    var starStr = '';
    for (var i = 0; i < 3; i++) starStr += i < stars ? '\u2605 ' : '\u2606 ';
    G.UI.text(ctx, starStr.trim(), G.W / 2, 116, G.Font.display(30), '#FFD97A', 'center');

    var mm = Math.floor(s.elapsed / 60), ss = Math.floor(s.elapsed % 60);
    var rows = [
      ['Modaks gathered', s.modaks, s.modaks * 50],
      ['Flowers and durva', s.flowers + s.durva, s.flowers * 30 + s.durva * 20],
      ['Divine marks', s.divine, s.divine * 90],
      ['Asuras turned back', s.kills, s.killPoints],
      ['Companion assists', s.assists, s.assistPoints],
      ['Damage taken', Math.round(s.damage), -Math.round(s.damage * 6)],
      ['Retries', s.retries, -s.retries * 250],
      ['Time  ' + mm + ':' + (ss < 10 ? '0' : '') + ss, '', f.timeBonus]
    ];
    if (f.noHit) rows.push(['Untouched journey', '', f.noHit]);

    var x0 = G.W / 2 - 230, y0 = 152;
    for (var r = 0; r < rows.length; r++) {
      var y = y0 + r * 27;
      ctx.globalAlpha = r % 2 ? 0.1 : 0.16;
      ctx.fillStyle = '#000'; ctx.fillRect(x0 - 12, y - 18, 484, 25);
      ctx.globalAlpha = 1;
      G.UI.text(ctx, rows[r][0], x0, y, G.Font.body(16, 500), '#F6EBD8');
      G.UI.text(ctx, String(rows[r][1]), x0 + 300, y, G.Font.body(16, 600), 'rgba(255,247,230,0.8)', 'right');
      var pts = rows[r][2];
      G.UI.text(ctx, (pts >= 0 ? '+' : '') + pts, x0 + 460, y, G.Font.body(16, 700), pts >= 0 ? '#FFD97A' : '#FF8A3D', 'right');
    }

    var ty = y0 + rows.length * 27 + 16;
    ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(x0 - 12, ty - 22, 484, 34);
    G.UI.text(ctx, 'Total punya', x0, ty, G.Font.display(22), '#FFF7E6');
    G.UI.text(ctx, f.total.toLocaleString(), x0 + 460, ty, G.Font.display(24), '#FFD97A', 'right');
    G.UI.text(ctx, 'Best: ' + G.Save.data.best.toLocaleString(), G.W / 2, ty + 28, G.Font.body(14, 600), 'rgba(255,247,230,0.75)', 'center');

    this.menuScore.draw(ctx, this.menuLayout(this.menuScore, 452, 40, 10, 300));
  }
};

/* Delayed callbacks run on the game clock, not the host event loop: they
   pause with the game and stay deterministic for the test harness. */
G.Timers = {
  list: [],
  after: function (sec, fn) { this.list.push({ t: sec, fn: fn }); },
  clear: function () { this.list.length = 0; },
  update: function (dt) {
    for (var i = this.list.length - 1; i >= 0; i--) {
      var e = this.list[i];
      e.t -= dt;
      if (e.t <= 0) { this.list.splice(i, 1); e.fn(); }
    }
  }
};
function setTimeoutSafe(fn, ms) { G.Timers.after(ms / 1000, fn); }



/* ===== 60_main.js ===== */
/* =========================================================================
   60_main.js  -  bootstrap: canvas scaling, the frame loop, the opening
   film, and the first-interaction audio unlock.
   ========================================================================= */

G.Boot = {
  start: function () {
    var canvas = document.getElementById('game');
    var ctx = canvas.getContext('2d', { alpha: false });
    var view = { scale: 1, ox: 0, oy: 0 };
    this.canvas = canvas; this.ctx = ctx; this.view = view;

    G.Save.load();
    G.Game.init(canvas, ctx, view);

    var self = this;
    function resize() {
      var dpr = Math.min(window.devicePixelRatio || 1, 2);
      var cw = canvas.clientWidth || window.innerWidth;
      var ch = canvas.clientHeight || window.innerHeight;
      canvas.width = Math.floor(cw * dpr);
      canvas.height = Math.floor(ch * dpr);
      var scale = Math.min(cw / G.W, ch / G.H);
      view.scale = scale;
      view.ox = (cw - G.W * scale) / 2;
      view.oy = (ch - G.H * scale) / 2;
      view.dpr = dpr;
      self.portrait = ch > cw && cw < 820;
    }
    window.addEventListener('resize', resize);
    window.addEventListener('orientationchange', function () { setTimeout(resize, 220); });
    resize();

    // audio needs a gesture before it may start
    function unlock() {
      G.Audio.init(); G.Audio.resume();
      if (self.introDone && G.Game.state === 'menu' && !G.Audio._track) G.Audio.music('divine');
    }
    window.addEventListener('pointerdown', unlock, { once: false });
    window.addEventListener('keydown', unlock, { once: false });

    this.setupIntro();

    var last = (typeof performance !== 'undefined' ? performance.now() : Date.now());
    function frame(now) {
      var dt = Math.min(0.05, (now - last) / 1000);
      last = now;
      self.step(dt);
      window.requestAnimationFrame(frame);
    }
    window.requestAnimationFrame(frame);
  },

  step: function (dt) {
    var ctx = this.ctx, view = this.view;
    G.Game.update(dt);
    ctx.save();
    ctx.setTransform(view.dpr || 1, 0, 0, view.dpr || 1, 0, 0);
    ctx.fillStyle = '#0B0614';
    ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
    ctx.translate(view.ox, view.oy);
    ctx.scale(view.scale, view.scale);
    ctx.beginPath();
    ctx.rect(0, 0, G.W, G.H);
    ctx.clip();
    G.Game.draw(ctx);
    ctx.restore();

    var hint = document.getElementById('rotate');
    if (hint) hint.style.display = (this.portrait && G.Game.state === 'play') ? 'flex' : 'none';
  },

  /* ------------------------------------------------------- opening film */
  setupIntro: function () {
    this.introDone = true;
    var wrap = document.getElementById('intro');
    if (wrap) wrap.style.display = 'none';
    G.Game.state = 'menu';
    return;

    function finish() {
      if (self.introDone) return;
      self.introDone = true;
      try { video && video.pause(); } catch (e) { }
      wrap.style.opacity = '0';
      setTimeout(function () { wrap.style.display = 'none'; }, 450);
      G.Save.data.introWatched = true;
      G.Save.save();
      G.Audio.init(); G.Audio.resume(); G.Audio.music('divine');
      G.Game.state = 'menu';
    }
    this.finishIntro = finish;

    if (G.Save.data.settings.skipIntro) {
      wrap.style.display = 'none'; this.introDone = true; return;
    }

    function showButton(label, handler) {
      if (!fallback) return;
      fallback.textContent = label;
      fallback.style.display = 'block';
      fallback.onclick = function (e) { e.stopPropagation(); handler(); };
    }

    if (skip) skip.addEventListener('click', function (e) { e.stopPropagation(); finish(); });

    if (!video) { showButton('Continue to the game', finish); return; }

    video.addEventListener('ended', finish);
    video.addEventListener('error', function () {
      // the film is optional: the game itself must still start
      showButton('Continue to the game', finish);
    });
    video.addEventListener('playing', function () {
      if (fallback) fallback.style.display = 'none';
    });

    function attempt() {
      var p = video.play();
      if (p && p.catch) {
        p.catch(function () {
          // sound needs a gesture on most browsers, so offer one
          showButton('Play the opening film', function () {
            var q = video.play();
            if (q && q.catch) q.catch(function () { finish(); });
          });
        });
      }
    }
    attempt();

    window.addEventListener('keydown', function (e) {
      if (!self.introDone && (e.code === 'Escape' || e.code === 'Space' || e.code === 'Enter')) finish();
    });
  }
};

if (typeof window !== 'undefined' && !window.__MV_TEST__) {
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { G.Boot.start(); });
  } else {
    G.Boot.start();
  }
}


window.MV = G;
})();

</script>
